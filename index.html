<!-- Apollo Company — Painel de Tráfego & Logística — V4 -->
<div id="root"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Outfit:wght@400;500;600;700&display=swap');

  /* ---- TEMA ESCURO TECH (preto + azul-bebê) ---- */
  :root{
    --bg:#070a0f; --panel:#0e131c; --panel-2:#141b27; --panel-3:#1d2736;
    --line:rgba(120,200,255,.16); --line-soft:rgba(255,255,255,.07);
    /* "gold" agora é azul — nomes mantidos pra não quebrar o resto do CSS */
    --gold:#5fc8ff; --gold-2:#8fdcff; --gold-dim:#2a8fd0;
    --txt:#eef4fb; --txt-2:#aebccd; --txt-3:#6f7e91;
    --green:#34d399; --green-bg:rgba(52,211,153,.14);
    --red:#ff6b6b; --red-bg:rgba(255,107,107,.14);
    --amber:#ffc24b; --amber-bg:rgba(255,194,75,.14);
    --blue:#5fc8ff; --blue-bg:rgba(95,200,255,.14);
    --shadow:0 10px 36px rgba(0,0,0,.6);
  }
  .light{
    --bg:#eef3f9; --panel:#ffffff; --panel-2:#f3f7fc; --panel-3:#e6eef7;
    --line:rgba(40,143,208,.26); --line-soft:rgba(0,0,0,.08);
    --gold:#1f8fd0; --gold-2:#15689c; --gold-dim:#5fc8ff;
    --txt:#0c1622; --txt-2:#46586b; --txt-3:#7c8b9c;
    --green:#16a36b; --green-bg:rgba(22,163,107,.12);
    --red:#e0483b; --red-bg:rgba(224,72,59,.1);
    --amber:#d49216; --amber-bg:rgba(212,146,22,.12);
    --blue:#1f8fd0; --blue-bg:rgba(31,143,208,.1);
    --shadow:0 8px 28px rgba(20,60,100,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #root{font-family:'Outfit',Arial,sans-serif;background:var(--bg);color:var(--txt);
    min-height:100vh;font-size:14px;line-height:1.5;transition:background .2s;
    background-image:radial-gradient(1000px 560px at 82% -12%,rgba(95,200,255,.16),transparent),
      radial-gradient(760px 440px at -12% 112%,rgba(95,200,255,.09),transparent);}
  .light #root{background-image:radial-gradient(1000px 560px at 82% -12%,rgba(95,200,255,.22),transparent),
      radial-gradient(760px 440px at -12% 112%,rgba(31,143,208,.1),transparent);}
  h1,h2,.brand b{font-family:'Bricolage Grotesque','Outfit',sans-serif;letter-spacing:-.01em}
  .app{display:flex;min-height:100vh}


  /* sidebar */
  .side{width:244px;flex-shrink:0;border-right:1px solid var(--line);
    padding:22px 14px;display:flex;flex-direction:column;gap:4px;
    background:linear-gradient(180deg,var(--panel),transparent);}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;}
  .brand .logo{width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    display:flex;align-items:center;justify-content:center;font-size:19px;}
  .brand b{font-size:14.5px;font-weight:800;letter-spacing:.2px;display:block}
  .brand span{font-size:9.5px;color:var(--txt-3);letter-spacing:1.6px;text-transform:uppercase;display:block;margin-top:1px}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
    color:var(--txt-2);cursor:pointer;font-weight:500;font-size:13px;transition:.14s;border:1px solid transparent}
  .nav:hover{background:var(--panel-2);color:var(--txt)}
  .nav.on{background:linear-gradient(90deg,rgba(212,175,55,.18),rgba(212,175,55,.05));
    color:var(--gold-2);border-color:var(--line);font-weight:600}
  .light .nav.on{background:linear-gradient(90deg,rgba(176,137,32,.16),rgba(176,137,32,.04))}
  .nav .ic{width:18px;text-align:center;font-size:15px}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
    font-weight:700;padding:1px 6px;border-radius:20px}
  .side-foot{margin-top:auto;font-size:10px;color:var(--txt-3);padding:14px 8px 0;border-top:1px solid var(--line-soft)}
  .theme-toggle{display:flex;gap:6px;margin:8px 4px 0}
  .theme-toggle button{flex:1;background:var(--panel-2);border:1px solid var(--line-soft);
    color:var(--txt-2);padding:7px;border-radius:8px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:600;transition:.14s}
  .theme-toggle button.on{background:var(--gold);color:#04121f;border-color:transparent}

  /* main */
  .main{flex:1;padding:26px 30px;overflow:auto;max-height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h1{font-size:22px;font-weight:800}
  .topbar .sub{font-size:12px;color:var(--txt-3);margin-top:2px}
  .spacer{flex:1}

  /* controles */
  .ctl{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--txt);padding:8px 11px;font-family:inherit;font-size:12.5px;outline:none}
  .ctl:focus{border-color:var(--gold)}
  select.ctl{cursor:pointer}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:12.5px;
    font-weight:500;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel-2);border-color:var(--gold)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    color:#04121f;border-color:transparent;font-weight:700}
  .btn.gold:hover{filter:brightness(1.08)}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .btn.danger{color:var(--red);border-color:var(--red-bg)}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px;
    position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--gold),transparent)}
  .kpi .lbl{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .kpi .val{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .val.gold{color:var(--gold-2)}
  .kpi .hint{font-size:10.5px;color:var(--txt-3);margin-top:4px}
  .kpi.hero{background:linear-gradient(135deg,rgba(212,175,55,.14),var(--panel))}
  .light .kpi.hero{background:linear-gradient(135deg,rgba(176,137,32,.1),var(--panel))}

  /* card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px}
  .card .desc{font-size:12px;color:var(--txt-2);margin-bottom:14px;line-height:1.6}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .card-head h2{margin:0}

  /* tabela */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--txt-2);font-weight:700;font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);
    white-space:nowrap}
  td{padding:10px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr.row:hover td{background:var(--panel-2)}
  .num{text-align:right}
  tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;color:var(--gold-2)}

  /* pill */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
    font-size:10.5px;font-weight:700;white-space:nowrap}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.gold{background:rgba(212,175,55,.14);color:var(--gold-2)}
  .pill.gray{background:var(--panel-3);color:var(--txt-2)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .col{flex:1;min-width:230px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:13px;padding:12px;display:flex;flex-direction:column}
  .col.over{border-color:var(--gold);background:rgba(212,175,55,.06)}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:0 3px}
  .col-head b{font-size:12px;font-weight:700}
  .col-head .ct{margin-left:auto;font-size:10.5px;color:var(--txt-3);
    background:var(--panel-3);padding:1px 8px;border-radius:20px;font-weight:700}
  .col-body{display:flex;flex-direction:column;gap:9px;min-height:60px;flex:1}
  .kcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    padding:11px;cursor:grab;transition:.12s}
  .kcard:hover{border-color:var(--gold)}
  .kcard.drag{opacity:.4}
  .kcard .kname{font-weight:700;font-size:12.5px}
  .kcard .kmeta{font-size:10.5px;color:var(--txt-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kcard .kval{color:var(--gold-2);font-weight:700;font-variant-numeric:tabular-nums}
  .col-empty{font-size:11px;color:var(--txt-3);text-align:center;padding:18px 0;
    border:1px dashed var(--line-soft);border-radius:9px}

  /* form */
  .form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .form .full{grid-column:span 2}
  .fld label{display:block;font-size:10.5px;color:var(--txt-3);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    padding:8px 10px;font-family:inherit;font-size:12.5px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
  .fld textarea{resize:vertical;min-height:80px}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

  .empty{text-align:center;padding:40px 20px;color:var(--txt-3)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--txt-3);gap:10px}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--gold);border-radius:10px;
    padding:11px 18px;font-size:12.5px;z-index:99;box-shadow:var(--shadow);animation:up .25s ease;color:var(--txt)}
  @keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:980px){.split{grid-template-columns:1fr}}
  @media(max-width:880px){.side{width:66px}.brand b,.brand span,.nav span:not(.ic):not(.badge),.side-foot,.theme-toggle{display:none}.nav{justify-content:center}}
  .mini-bar{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin-top:8px}
  .mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
  .seg button{background:none;border:none;color:var(--txt-2);padding:5px 11px;border-radius:6px;
    cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700}
  .seg button.on{background:var(--gold);color:#04121f}
  code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-size:11.5px;color:var(--gold-2);
    border:1px solid var(--line-soft)}
  .ebtn{background:var(--panel);border:1px solid var(--line-soft);color:var(--txt);
    min-width:30px;height:30px;padding:0 7px;border-radius:7px;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;transition:.12s}
  .ebtn:hover{border-color:var(--gold);filter:brightness(1.05)}
  .ebtn:active{transform:scale(.94)}
  .copydoc:empty:before{content:'Escreva sua copy aqui…';color:var(--txt-3)}
  .copydoc h2{font-size:17px;font-weight:800;margin:10px 0 6px}
  .copydoc ul{margin:6px 0 6px 20px}
  .copydoc:focus{background:var(--panel)}
  @media(max-width:900px){.copy-grid{grid-template-columns:1fr !important}}
</style>
<script>
(function(){
  "use strict";
  const K='apollodash:state';
  const fmtBRL=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const fmtN=n=>(n||0).toLocaleString('pt-BR');
  const fmtPct=n=>(n||0).toFixed(2)+'%';
  const uid=()=>Math.random().toString(36).slice(2,9);
  const today=()=>new Date().toISOString().slice(0,10);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- estado padrão ----
  const DEFAULT={
    accounts:[
      {id:'a1',nome:'AP CA08',metaId:'1479485729200192',status:'ativa'},
      {id:'a2',nome:'Contingência Black',metaId:'993400546343835',status:'ativa'}
    ],
    trafego:[], sales:[], orders:[], ctwa:[], tasks:[], docs:[], devocionalFeito:{},
    config:{backendUrl:'',token:'',theme:'dark'}
  };

  let S=JSON.parse(JSON.stringify(DEFAULT));
  let tab='dash', modal=null, filterAcc='all', filterRange=7, drag=null;
  let syncState={status:'idle',at:null};
  let customRange=null; // {de,ate}
  let docLeft=null, docRight=null; // ids dos docs nos dois lados

  // ---- storage ----
  async function load(){
    try{const r=await window.storage.get(K);
      if(r&&r.value) S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r.value));
    }catch(e){}
  }
  async function save(){
    // o tráfego do Meta é re-puxado a cada sync — fora do storage
    const leve={...S, trafego:[]};
    try{
      await window.storage.set(K,JSON.stringify(leve));
    }catch(e){
      // tentativa 2: sem o histórico de tráfego e com docs enxutos
      try{
        const min={...leve, ctwa:(leve.ctwa||[]).slice(0,500),
          sales:(leve.sales||[]).slice(0,1000)};
        await window.storage.set(K,JSON.stringify(min));
        toast('Salvo (espaço otimizado)');
      }catch(e2){
        toast('⚠️ Erro ao salvar — espaço cheio. Exporte um backup em Configurações.');
      }
    }
  }
  function persist(){save();render();}

  // ---- toast ----
  let toastT;
  function toast(msg){
    const old=document.querySelector('.toast'); if(old) old.remove();
    const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800);
  }

  // ---- filtro de período ----
  function yesterday(){
    const d=new Date(); d.setDate(d.getDate()-1);
    return d.toISOString().slice(0,10);
  }
  function inRange(dateStr){
    if(!dateStr) return false;
    const ds=String(dateStr).slice(0,10);
    if(customRange) return ds>=customRange.de && ds<=customRange.ate;
    if(filterRange==='all') return true;
    if(filterRange==='today') return ds===today();
    if(filterRange==='yesterday') return ds===yesterday();
    // calcula a data-limite N dias atrás e compara como string (imune a fuso)
    const lim=new Date();
    lim.setDate(lim.getDate()-(Number(filterRange)-1));
    const limStr=lim.toISOString().slice(0,10);
    return ds>=limStr && ds<=today();
  }
  function accOk(id){return filterAcc==='all'||id===filterAcc;}
  function rangeLabel(){
    if(customRange) return customRange.de+' a '+customRange.ate;
    if(filterRange==='today') return 'Hoje';
    if(filterRange==='yesterday') return 'Ontem';
    if(filterRange==='all') return 'Todo o período';
    return 'Últimos '+filterRange+' dias';
  }

  // ---- métricas agregadas de uma lista de tráfego ----
  function aggTraf(list){
    const a={investimento:0,conversas:0,comprasMeta:0,valorComprasMeta:0,
      impressions:0,clicks:0,linkClicks:0,vPlay:0,vP25:0,vP100:0,vThru:0};
    list.forEach(t=>{
      a.investimento+=+t.investimento||0; a.conversas+=+t.conversas||0;
      a.comprasMeta+=+t.compras||0; a.valorComprasMeta+=+t.valorCompras||0;
      a.impressions+=+t.impressions||0; a.clicks+=+t.clicks||0; a.linkClicks+=+t.linkClicks||0;
      a.vPlay+=+t.vPlay||0; a.vP25+=+t.vP25||0; a.vP100+=+t.vP100||0; a.vThru+=+t.vThru||0;
    });
    // derivadas
    a.cpm = a.impressions? (a.investimento/a.impressions*1000):0;
    a.ctr = a.impressions? (a.linkClicks/a.impressions*100):0;
    // Hook Rate = views de 3s ÷ impressões  (quanto do público o vídeo "fisga")
    a.hookRate = a.impressions? (a.vPlay/a.impressions*100):0;
    // Hold Rate = ThruPlay (15s ou vídeo completo) ÷ impressões  (retenção real)
    a.holdRate = a.impressions? (a.vThru/a.impressions*100):0;
    a.custoConversa = a.conversas? (a.investimento/a.conversas):0;
    a.convPorMsg = a.linkClicks? (a.conversas/a.linkClicks):0;
    return a;
  }

  // ---- KPIs do dashboard ----
  function kpis(){
    const tf=S.trafego.filter(t=>inRange(t.data)&&accOk(t.accountId));
    const sl=S.sales.filter(s=>inRange(s.data)&&accOk(s.accountId));
    const a=aggTraf(tf);
    const aprov=sl.filter(s=>s.status==='aprovada');
    const receitaPayt=aprov.reduce((x,s)=>x+(+s.valor||0),0);
    const receitaTotal=sl.reduce((x,s)=>x+(+s.valor||0),0);
    const comprasAprovPayt=aprov.length;
    // fonte: se já tem venda na Payt usa ela; senão usa o que o Meta reporta
    const temPayt = sl.length>0;
    const compras = temPayt? sl.length : a.comprasMeta;
    const comprasAprov = temPayt? comprasAprovPayt : a.comprasMeta;
    const receita = temPayt? receitaPayt : a.valorComprasMeta;
    return {
      ...a,
      fontePayt:temPayt,
      comprasPlataforma:compras, comprasAprov,
      receita, receitaTotal: temPayt? receitaTotal : a.valorComprasMeta,
      roas: a.investimento? receita/a.investimento:0,
      ticket: comprasAprov? receita/comprasAprov:0,
      cpa: comprasAprov? a.investimento/comprasAprov:0,
      taxaAprov: temPayt&&sl.length? comprasAprovPayt/sl.length*100:100,
      leadsPorVenda: comprasAprov? a.conversas/comprasAprov:0
    };
  }

  // ================= RENDER =================
  function render(){
    const root=document.getElementById('root');
    document.documentElement.className = S.config.theme==='light'?'light':'';
    root.className = S.config.theme==='light'?'light':'';
    root.innerHTML=`<div class="app">${sidebar()}<div class="main">${view()}</div></div>${modal||''}`;
    wire();
  }

  function sidebar(){
    const items=[
      ['dash','🚀','Dashboard',0],
      ['contas','📊','Contas de Anúncio',0],
      ['vendas','💰','Vendas / WebHook',0],
      ['afterpay','🔄','Kanban After Pay',S.sales.filter(s=>!s.tipo).length],
      ['pedidos','📦','Kanban Pedidos',S.orders.filter(o=>o.status==='problema').length],
      ['ctwa','💬','WhatsApp CTWA',S.ctwa.filter(c=>!c.enviadoMeta).length],
      ['tarefas','✅','Tarefas do Dia',(S.tasks||[]).filter(t=>!t.done).length],
      ['criativos','✍️','Criativos / Copy',0],
      ['config','⚙️','Configurações',0]
    ];
    return `<div class="side">
      <div class="brand">
        <div class="logo">🚀</div>
        <div><b>Apollo Company</b><span>Tráfego & Logística</span></div>
      </div>
      ${items.map(([id,ic,lbl,bd])=>`
        <div class="nav ${tab===id?'on':''}" data-tab="${id}">
          <span class="ic">${ic}</span><span>${lbl}</span>
          ${bd?`<span class="badge">${bd}</span>`:''}
        </div>`).join('')}
      <div class="theme-toggle">
        <button data-theme="light" class="${S.config.theme==='light'?'on':''}">☀️ Claro</button>
        <button data-theme="dark" class="${S.config.theme==='dark'?'on':''}">🌙 Escuro</button>
      </div>
      <div class="side-foot">Apollo V4 🚀<br>${S.config.backendUrl?'Sincronizado ao vivo':'Modo manual'}</div>
    </div>`;
  }

  function syncBadge(){
    const m={idle:['gray','aguardando'],syncing:['amber','atualizando…'],
      ok:['green','ao vivo'],err:['red','erro']};
    const [c,t]=m[syncState.status]||m.idle;
    const when=syncState.at?' · '+syncState.at.toLocaleTimeString('pt-BR').slice(0,5):'';
    return `<span class="pill ${c}"><span class="dot"></span>${t}${when}</span>`;
  }

  function rangeBar(){
    return `<div class="seg" id="rangeSeg">
      ${[['today','Hoje'],['yesterday','Ontem'],[7,'7d'],[15,'15d'],[30,'30d'],[90,'90d'],['all','Tudo']].map(([v,l])=>
        `<button data-r="${v}" class="${!customRange&&String(filterRange)===String(v)?'on':''}">${l}</button>`).join('')}
      <button data-r="custom" class="${customRange?'on':''}">📅 Período</button>
    </div>
    <select class="ctl" id="accFilter">
      <option value="all">🌐 Todas as contas</option>
      ${S.accounts.map(a=>`<option value="${a.id}" ${filterAcc===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}
    </select>`;
  }

  function view(){
    return ({dash:viewDash,contas:viewContas,vendas:viewVendas,afterpay:viewAfterpay,
      pedidos:viewPedidos,ctwa:viewCtwa,tarefas:viewTarefas,criativos:viewCriativos,
      config:viewConfig}[tab]||viewDash)();
  }

  // ---------- DASHBOARD ----------
  // ---- versículo do dia (foco em trabalho, prosperidade, perseverança) ----
  const VERSICULOS=[
    ['O que trabalha com mão diligente se enriquece.','Provérbios 10:4'],
    ['Tudo posso naquele que me fortalece.','Filipenses 4:13'],
    ['E tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor.','Colossenses 3:23'],
    ['Os planos do diligente tendem à abundância.','Provérbios 21:5'],
    ['Não desanimemos de fazer o bem, pois a seu tempo ceifaremos, se não desfalecermos.','Gálatas 6:9'],
    ['Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará.','Salmos 37:5'],
    ['O Senhor te abençoará em tudo quanto fizeres.','Deuteronômio 15:10'],
    ['Vês um homem perito na sua obra? Perante reis será posto.','Provérbios 22:29'],
    ['Esforça-te, e tem bom ânimo; não temas, nem te espantes.','Josué 1:9'],
    ['A bênção do Senhor é que enriquece, e não acrescenta dores.','Provérbios 10:22'],
    ['Aquele que semeia com fartura, com fartura também ceifará.','2 Coríntios 9:6'],
    ['O coração do homem planeja o seu caminho, mas o Senhor lhe dirige os passos.','Provérbios 16:9'],
    ['Porque eu bem sei os pensamentos que tenho a vosso respeito, pensamentos de paz, e não de mal.','Jeremias 29:11'],
    ['Os que esperam no Senhor renovarão as suas forças.','Isaías 40:31'],
    ['Lança o teu pão sobre as águas, porque depois de muitos dias o acharás.','Eclesiastes 11:1'],
    ['Põe a tua confiança no Senhor de todo o teu coração.','Provérbios 3:5'],
    ['Em tudo dai graças, porque esta é a vontade de Deus.','1 Tessalonicenses 5:18'],
    ['Mãos negligentes empobrecem, mas a mão dos diligentes enriquece.','Provérbios 10:4'],
    ['O Senhor é a minha força e o meu escudo; nele confiou o meu coração.','Salmos 28:7'],
    ['Bem-aventurado o homem que acha sabedoria, porque é melhor a sua mercadoria do que a prata.','Provérbios 3:13']
  ];
  function versiculoDoDia(){
    // muda todo dia, baseado na data
    const d=new Date();
    const idx=(d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) % VERSICULOS.length;
    return VERSICULOS[idx];
  }
  function versiculoCard(){
    const [txt,ref]=versiculoDoDia();
    return `<div class="card" style="background:linear-gradient(135deg,rgba(212,175,55,.16),var(--panel));
      border-color:var(--gold-dim)">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="font-size:26px;line-height:1">📖</div>
        <div style="flex:1">
          <div style="font-size:10px;color:var(--gold-2);font-weight:700;letter-spacing:1px;
            text-transform:uppercase;margin-bottom:6px">Palavra do dia ✨</div>
          <div style="font-size:15px;font-weight:600;font-style:italic;line-height:1.55">
            "${esc(txt)}"</div>
          <div style="font-size:12px;color:var(--txt-2);margin-top:7px;font-weight:700">— ${esc(ref)}</div>
        </div>
      </div>
    </div>`;
  }
  // ---- Devocional de 30 dias (tema, mensagem, história aplicável, oração) ----
  const DEVOCIONAIS=[
    {t:'Comece com propósito',
     m:'Todo dia de trabalho é uma folha em branco. Antes de abrir o painel, abrir as campanhas, responder a primeira mensagem — pare. Respire. Lembre que o que você constrói tem um propósito maior do que o número na tela. Deus não te deu talento pra você desperdiçar em ansiedade. Ele te deu pra você multiplicar com paz.',
     h:'Na parábola dos talentos (Mateus 25), o senhor não cobrou do servo o tamanho do resultado — cobrou a coragem de agir. O servo que enterrou o talento foi repreendido não por perder dinheiro, mas por ter sido paralisado pelo medo. Hoje, não enterre o seu dia no medo. Coloque seus talentos pra trabalhar.',
     o:'Senhor, eu entrego este dia nas Tuas mãos. Que cada decisão que eu tomar tenha o Teu direcionamento. Tira de mim o medo e me dá coragem para agir com sabedoria. Que o meu trabalho hoje seja uma oferta a Ti. Amém.'},
    {t:'A diligência silenciosa',
     m:'Existe um trabalho que ninguém vê: o ajuste fino, o teste que falhou, a copy reescrita pela décima vez. É nesse trabalho invisível que o caráter se forma. Não despreze os dias pequenos. A consistência no escondido é o que constrói o resultado no aberto.',
     h:'Davi era pastor de ovelhas muito antes de ser rei. Ninguém o via cuidando do rebanho, enfrentando o leão e o urso no anonimato. Mas foi naquele trabalho silencioso que Deus formou o homem que enfrentaria Golias. O que você faz quando ninguém vê está te preparando para o que todos verão.',
     o:'Pai, me ajuda a ser fiel nas pequenas coisas. Quando o trabalho for cansativo e invisível, lembra-me de que Tu vês tudo. Forma o meu caráter no escondido. Amém.'},
    {t:'Ansiedade não paga conta',
     m:'A preocupação rouba a energia que você precisa pra resolver o problema. Você já reparou? Ninguém nunca melhorou um ROAS se desesperando. A ansiedade é um imposto que você paga adiantado por um problema que talvez nem aconteça. Troque a preocupação pela ação possível de hoje.',
     h:'Jesus disse: "Qual de vós, por mais que se preocupe, pode acrescentar um côvado à sua estatura?" (Mateus 6:27). Ele apontou para os lírios do campo — que não se afadigam, e ainda assim são vestidos com beleza. O recado não é "não trabalhe", é "não se corroa". Faça a tua parte e confie o resto.',
     o:'Senhor, eu coloco diante de Ti tudo o que me preocupa hoje. As metas, as contas, o que não controlo. Troca a minha ansiedade pela Tua paz. Eu faço a minha parte; o resto entrego a Ti. Amém.'},
    {t:'O vício que rouba o foco',
     m:'Todo vício promete alívio e cobra liberdade. Pode ser a rolagem infinita do feed, a checagem compulsiva de métrica a cada 5 minutos, qualquer fuga que parece descanso mas é só dispersão. Hoje, identifique uma coisa que está roubando seu foco e coloque um limite. Liberdade é poder escolher.',
     h:'Paulo escreveu: "Todas as coisas me são lícitas, mas nem todas convêm; todas as coisas me são lícitas, mas eu não me deixarei dominar por nenhuma" (1 Coríntios 6:12). Ele entendeu que o problema não é só o que é certo ou errado — é o que te domina. Não deixe nada além de Deus ter as rédeas da sua mente.',
     o:'Deus, me mostra hoje o que está me dominando sem eu perceber. Me dá força para colocar limites e disciplina para mantê-los. Quero ter a mente livre para Te servir e trabalhar bem. Amém.'},
    {t:'Trabalhe como para o Senhor',
     m:'Tem um tipo de excelência que não depende de quem está olhando. Quando você escreve uma copy, monta uma campanha, responde um cliente — você pode fazer no automático ou pode fazer como uma oferta. A diferença não está no resultado imediato, está em quem você se torna fazendo.',
     h:'"E tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor e não aos homens" (Colossenses 3:23). Essa carta foi escrita até para servos — pessoas em trabalho duro e sem reconhecimento. Paulo elevou o trabalho comum a um ato de adoração. O seu trabalho de hoje pode ser isso.',
     o:'Senhor, que tudo o que eu fizer hoje seja feito de coração, como para Ti. Tira de mim a preguiça e o "tanto faz". Que a minha excelência seja uma forma de Te honrar. Amém.'},
    {t:'O descanso também é mandamento',
     m:'Você não é uma máquina de produzir. Deus, que poderia ter criado o mundo em um instante, escolheu descansar no sétimo dia — não por cansaço, mas para ensinar um ritmo. Quem não descansa não rende; quem não para, não enxerga. Hoje, planeje o seu descanso com a mesma seriedade que planeja o seu trabalho.',
     h:'No deserto, Deus mandava o povo recolher o maná para um dia só — exceto antes do sábado, quando recolhiam para dois. Quem tentava estocar por ganância via o maná apodrecer (Êxodo 16). A lição: confiar que amanhã também haverá provisão. Você não precisa carregar o peso de todos os dias hoje.',
     o:'Pai, me ensina o ritmo certo entre trabalho e descanso. Que eu não confunda movimento com progresso. Que eu descanse confiando que Tu cuidas do amanhã. Amém.'},
    {t:'Semeia hoje, colhe depois',
     m:'O trabalho de hoje raramente paga hoje. A campanha que você ajusta agora dá resultado daqui a dias. A copy que você melhora hoje converte semana que vem. Quem precisa de recompensa imediata desiste cedo. Quem entende o tempo da semeadura permanece.',
     h:'"E não nos cansemos de fazer o bem, porque a seu tempo ceifaremos, se não desfalecermos" (Gálatas 6:9). A palavra-chave é "a seu tempo". O agricultor não desenterra a semente todo dia para ver se cresceu. Ele rega, espera e confia no processo que Deus criou.',
     o:'Senhor, me dá paciência para o tempo da colheita. Que eu não desanime entre semear e ceifar. Ajuda-me a permanecer fiel mesmo sem ver o resultado ainda. Amém.'},
    {t:'A integridade no detalhe',
     m:'Quem você é nos detalhes pequenos é quem você é de verdade. A promessa que você cumpre, o cliente que você não engana, o número que você não infla pra parecer melhor. A integridade não dá um pico de resultado — ela dá algo melhor: uma base que não desmorona.',
     h:'"Quem é fiel no pouco, também é fiel no muito; e quem é injusto no pouco, também é injusto no muito" (Lucas 16:10). Jesus ligou diretamente o caráter no pequeno à confiança no grande. Deus observa como você lida com o que parece insignificante.',
     o:'Deus, me ajuda a ter integridade nos detalhes que ninguém vê. Que eu seja a mesma pessoa no escondido e no aberto. Constrói em mim uma base firme. Amém.'},
    {t:'Quando o resultado não vem',
     m:'Vai ter dia que você fez tudo certo e o resultado não veio. A campanha não escalou, a venda não fechou, o esforço não rendeu. Esses dias testam não a sua competência, mas a sua fé. Resultado é consequência; fidelidade é escolha. Continue escolhendo.',
     h:'Os discípulos pescaram a noite inteira e não pegaram nada. Quando Jesus mandou lançar a rede de novo, Pedro respondeu: "sobre a tua palavra lançarei a rede" (Lucas 5:5). Ele estava cansado e sem resultado, mas obedeceu mais uma vez. A pesca milagrosa veio depois da persistência obediente.',
     o:'Senhor, nos dias em que o resultado não vem, segura a minha fé. Que eu não meça o meu valor pelo número da tela. Me dá forças para lançar a rede mais uma vez. Amém.'},
    {t:'Comunhão acima da competição',
     m:'O mercado te ensina a ver todo mundo como concorrente. Mas a vida foi feita para comunhão, não para isolamento. Ter com quem dividir uma ideia, uma vitória, uma dúvida — isso não é fraqueza, é sabedoria. Ninguém constrói algo grande sozinho e em paz ao mesmo tempo.',
     h:'"Melhor é serem dois do que um, porque têm melhor paga do seu trabalho. Se um cair, o outro levanta o seu companheiro" (Eclesiastes 4:9-10). Salomão, o homem mais rico de sua era, sabia: prosperidade sem ninguém ao lado é solidão. Cultive as pessoas certas perto de você.',
     o:'Pai, me dá pessoas certas para caminhar comigo. Tira de mim o orgulho de achar que preciso fazer tudo sozinho. Que eu valorize a comunhão acima da competição. Amém.'},
    {t:'A oração antes da estratégia',
     m:'Você abre o dia conferindo métrica ou conversando com Deus? Não tem nada de errado em planejar — mas a primeira voz que você ouve de manhã molda o resto do dia. Cinco minutos de oração antes da estratégia mudam a fonte de onde você tira a sua paz.',
     h:'"De madrugada, muito antes de o dia clarear, Jesus se levantou e saiu para um lugar deserto, e ali orava" (Marcos 1:35). O homem mais ocupado e requisitado que já existiu priorizava a oração antes da agenda. Se Ele precisava, você também precisa.',
     o:'Senhor, que a primeira coisa que eu faça hoje seja Te buscar. Antes da estratégia, a oração. Antes do número, a Tua presença. Conduz o meu dia. Amém.'},
    {t:'O perigo da ganância',
     m:'Querer crescer é bom. Querer crescer a qualquer custo é uma armadilha. A ganância nunca diz "chega" — ela só move a linha de chegada para mais longe. Hoje, defina o que é suficiente. Não para parar de crescer, mas para crescer livre, sem ser escravo do "mais".',
     h:'Jesus contou sobre o homem rico que teve uma supercolheita e decidiu construir celeiros maiores para guardar tudo, dizendo à sua alma: "descansa, come, bebe". Mas naquela noite sua vida foi pedida (Lucas 12). A lição não é contra prosperar — é contra fazer do acúmulo o sentido da vida.',
     o:'Deus, me ensina a diferença entre ambição saudável e ganância. Que eu prospere sem virar escravo do dinheiro. Que a minha segurança esteja em Ti, não no celeiro. Amém.'},
    {t:'Palavras que constroem',
     m:'Você passa o dia escrevendo — copy, mensagem, resposta. Palavras são a sua ferramenta. Mas elas constroem ou destroem também fora do trabalho: na conversa com a equipe, na mensagem para a família, no que você fala de si mesmo. Use o seu dom de comunicar para edificar.',
     h:'"A morte e a vida estão no poder da língua" (Provérbios 18:21). Salomão não estava exagerando. As palavras que você repete sobre o seu negócio, sobre as pessoas e sobre você mesmo plantam realidades. Escolha plantar vida.',
     o:'Senhor, governa a minha língua hoje. Que as minhas palavras construam, encorajem e tragam vida. Tanto nas copies quanto nas conversas. Amém.'},
    {t:'Aprenda com o fracasso',
     m:'Uma campanha que não performou não é um veredito sobre você — é um dado. O fracasso só é desperdício se você não extrair a lição. Quem erra e aprende avança; quem erra e só se culpa, trava. Hoje, olhe um erro recente e pergunte: o que isso me ensina?',
     h:'Pedro negou Jesus três vezes — um fracasso enorme, público e doloroso. Mas Jesus o restaurou e três vezes lhe confiou: "apascenta as minhas ovelhas" (João 21). O fracasso de Pedro não foi o fim; foi parte da formação do líder que ele se tornou.',
     o:'Pai, me ajuda a aprender com os meus erros sem me afundar neles. Transforma cada fracasso em lição. Restaura a minha confiança como restauraste Pedro. Amém.'},
    {t:'Generosidade que volta',
     m:'Existe uma economia espiritual que o mercado não ensina: dar abre, reter fecha. Não é mágica — é princípio. Quem compartilha conhecimento, ajuda quem está começando, abençoa sem esperar retorno, vive uma abundância que o sovina nunca conhece.',
     h:'"Há quem reparte, e ainda lhe é acrescentado mais; e há quem retém mais do que é justo, mas para a sua pobreza" (Provérbios 11:24). É um paradoxo divino: a mão fechada para dar também fica fechada para receber. A generosidade não te empobrece.',
     o:'Senhor, me dá um coração generoso. Que eu reparta conhecimento, tempo e recursos sem medo. Confio que Tu és a minha fonte. Amém.'},
    {t:'Foco: uma coisa de cada vez',
     m:'A dispersão se disfarça de produtividade. Dez abas abertas, cinco projetos pela metade, a sensação de estar sempre correndo e nunca chegando. Foco é escolher o que NÃO fazer agora. Hoje, escolha a tarefa mais importante e termine ela antes de começar outra.',
     h:'Marta estava "distraída com muitos serviços" enquanto Maria escolheu o essencial — sentar aos pés de Jesus. Ele disse: "Maria escolheu a boa parte" (Lucas 10:42). Não que servir fosse errado; o problema era a distração ansiosa de Marta. Foco é escolher a boa parte.',
     o:'Deus, me dá clareza para escolher o que importa hoje. Tira de mim a dispersão ansiosa. Que eu faça uma coisa bem feita de cada vez. Amém.'},
    {t:'Sua identidade não é o seu resultado',
     m:'Num dia de venda boa você se sente um gênio; num dia ruim, um fracasso. Esse sobe-e-desce é exaustivo — e é mentira. Você não é o seu ROAS. O seu valor foi definido antes de qualquer métrica existir. Trabalhe a partir da segurança, não para conquistá-la.',
     h:'Quando Jesus foi batizado, antes de fazer um único milagre, o céu se abriu e Deus declarou: "Este é o meu Filho amado, em quem me comprazo" (Mateus 3:17). A aprovação veio ANTES da performance. A sua identidade como filho de Deus não depende do seu desempenho.',
     o:'Pai, me lembra hoje de quem eu sou em Ti. Que o meu valor não suba e desça com os números. Eu trabalho a partir do Teu amor, não para merecê-lo. Amém.'},
    {t:'Persistência na adversidade',
     m:'Vai ter temporada difícil. Conta de anúncio bloqueada, mercado mudando, algo quebrando bem quando você não podia. A adversidade não pergunta se é um bom momento. Mas ela também não tem a palavra final. Quem persiste com fé atravessa o que faz o desistente parar.',
     h:'Paulo listou o que enfrentou: naufrágios, prisões, fome, perigos de todo tipo (2 Coríntios 11). E ainda escreveu: "estou bem certo de que nem a morte, nem a vida... poderá nos separar do amor de Deus" (Romanos 8:38-39). A adversidade dele foi real — e a fé dele, maior.',
     o:'Senhor, nas temporadas difíceis, segura a minha mão. Que a adversidade não tenha a palavra final sobre mim. Me dá persistência que vem da fé. Amém.'},
    {t:'Gratidão muda a perspectiva',
     m:'É fácil ver só o que falta: a meta não batida, o que o concorrente tem, o próximo nível. Mas a gratidão reorganiza os olhos. Antes de listar o que você quer, liste três coisas que você já tem. Quem agradece o caminho anda mais leve.',
     h:'Dez leprosos foram curados por Jesus. Só um voltou para agradecer. Jesus perguntou: "Não foram dez os curados? Onde estão os nove?" (Lucas 17:17). Todos receberam a cura; só um recebeu também a alegria de reconhecer a graça. A gratidão completa a bênção.',
     o:'Senhor, abre os meus olhos para tudo o que eu já tenho. Que eu seja como o leproso que voltou. Recebe a minha gratidão por este dia, por este trabalho, pela vida. Amém.'},
    {t:'Sabedoria pede direção',
     m:'Tem decisão que números não resolvem. Escalar ou segurar? Contratar ou esperar? Mudar o rumo ou insistir? A inteligência analisa os dados; a sabedoria pede direção a quem vê o que você não vê. Não tome as decisões grandes sozinho e na pressa.',
     h:'"Se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente e nada lhes lança em rosto, e ser-lhe-á concedida" (Tiago 1:5). Deus não se irrita quando você pede direção — Ele dá de bom grado. Pedir sabedoria é sinal de maturidade, não de fraqueza.',
     o:'Deus, eu preciso de sabedoria para as decisões de hoje. Mostra-me o que eu não consigo enxergar sozinho. Conduz os meus passos. Amém.'},
    {t:'O orgulho precede a queda',
     m:'O sucesso tem um efeito colateral perigoso: faz a gente achar que não precisa mais aprender, ouvir, ou se cuidar. O orgulho não avisa que chegou — ele se disfarça de confiança. Hoje, faça um exercício de humildade: peça uma opinião e ouça de verdade.',
     h:'"A soberba precede a ruína, e a altivez do espírito precede a queda" (Provérbios 16:18). O rei Nabucodonosor, no auge, olhou seu império e se gabou: "esta é a grande Babilônia que eu edifiquei". Naquele instante perdeu tudo (Daniel 4). O orgulho cega antes de derrubar.',
     o:'Pai, me guarda do orgulho que se disfarça de confiança. Que eu nunca pare de aprender e ouvir. Mantém o meu coração humilde mesmo nas vitórias. Amém.'},
    {t:'Honre quem trabalha com você',
     m:'Você não constrói sozinho. Tem gente que te ajuda — sócio, prestador, fornecedor, quem responde mensagem, quem produz criativo. A forma como você trata quem trabalha com você revela o seu caráter mais do que qualquer resultado. Honre, pague bem, reconheça.',
     h:'"Não retenhas o salário do trabalhador pobre... no seu dia lhe darás o seu salário" (Deuteronômio 24:14-15). Deus se importa com como o trabalhador é tratado. A prosperidade construída sobre a exploração do outro tem um custo que não aparece na planilha.',
     o:'Senhor, me ajuda a honrar quem trabalha comigo. Que eu seja justo, generoso e grato. Que o meu sucesso abençoe quem está ao meu lado. Amém.'},
    {t:'A paz que excede o entendimento',
     m:'Existe uma paz que não depende das circunstâncias. Não é a ausência de problemas — é uma quietude interior no meio deles. Ela não vem de resolver tudo; vem de entregar tudo. Hoje, no meio do que estiver pesado, busque essa paz que não faz sentido lógico.',
     h:'"Não andeis ansiosos por coisa alguma; antes em tudo sejam os vossos pedidos conhecidos diante de Deus pela oração... E a paz de Deus, que excede todo o entendimento, guardará os vossos corações" (Filipenses 4:6-7). Paulo escreveu isso de uma prisão. A paz dele não dependia da cela.',
     o:'Senhor, me dá a Tua paz que excede o entendimento. Que ela guarde o meu coração no meio dos problemas. Eu entrego tudo a Ti. Amém.'},
    {t:'Disciplina é amor pelo futuro',
     m:'Disciplina parece dura no momento, mas é a forma mais concreta de amar o seu "eu" de amanhã. Acordar no horário, cumprir o planejado, resistir à distração — cada ato disciplinado é um presente que você manda pro futuro. Indisciplina é roubar de si mesmo.',
     h:'"Toda disciplina, no momento, não parece ser motivo de alegria, mas de tristeza; ao depois, no entanto, produz fruto pacífico aos que por ela têm sido exercitados" (Hebreus 12:11). O texto admite: dói agora. Mas o fruto vem "ao depois". Disciplina é fé aplicada ao tempo.',
     o:'Deus, me dá disciplina que nasce do amor, não da culpa. Que eu cuide hoje do meu "eu" de amanhã. Que o fruto pacífico venha. Amém.'},
    {t:'Não compare a sua jornada',

  // ---- Devocional do dia: rotaciona pelo ciclo de 30 dias ----
  function devocionalDoDia(){
    const inicio=new Date(2026,0,1); // âncora fixa
    const hoje=new Date();
    const dias=Math.floor((hoje-inicio)/86400000);
    const idx=((dias % DEVOCIONAIS.length)+DEVOCIONAIS.length)%DEVOCIONAIS.length;
    return {d:DEVOCIONAIS[idx],idx};
  }

        ${pend.slice(0,6).map(t=>`<div style="display:flex;align-items:center;gap:11px;
          background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:10px 12px">

  function campaignTable(){
    const tf=S.trafego.filter(t=>inRange(t.data)&&accOk(t.accountId)&&t.campaignId);
    const sl=S.sales.filter(s=>inRange(s.data)&&accOk(s.accountId)&&s.status==='aprovada');
    if(!tf.length) return emptyBox('🛰️ Sem dados de campanha. Rode "Sincronizar Meta Ads" em Configurações.');
    const map={};
    tf.forEach(t=>{
      const c=map[t.campaignId]||(map[t.campaignId]={nome:t.campaignName||t.campaignId,rows:[],vendas:0,rec:0});
      c.rows.push(t);
    });
    sl.filter(s=>s.campaignId).forEach(s=>{
      if(map[s.campaignId]){map[s.campaignId].vendas++;map[s.campaignId].rec+=+s.valor||0;}
    });
    const rows=Object.values(map).map(c=>{
      const a=aggTraf(c.rows);
      // se a campanha não tem venda Payt, usa o que o Meta reportou
      const vendas = c.vendas>0? c.vendas : a.comprasMeta;
      const rec = c.vendas>0? c.rec : a.valorComprasMeta;
      return {nome:c.nome,...a,vendas,rec,
        cpa:vendas?a.investimento/vendas:0, roas:a.investimento?rec/a.investimento:0};
    }).sort((a,b)=>b.investimento-a.investimento);
    const tot=rows.reduce((t,r)=>{['investimento','conversas','vendas','rec'].forEach(k=>t[k]=(t[k]||0)+r[k]);return t;},{});
    return `<div class="tbl-wrap"><table>
      <thead><tr><th>Campanha</th><th class="num">Invest.</th><th class="num">Conversas</th>
      <th class="num">Custo/conv.</th><th class="num">CPM</th><th class="num">CTR</th>
      <th class="num">Hook</th><th class="num">Hold</th>
      <th class="num">Vendas</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="row">
        <td><b>${esc(r.nome)}</b></td>
        <td class="num">${fmtBRL(r.investimento)}</td>
        <td class="num">${fmtN(r.conversas)}</td>
        <td class="num">${fmtBRL(r.custoConversa)}</td>
        <td class="num">${fmtBRL(r.cpm)}</td>
        <td class="num">${fmtPct(r.ctr)}</td>
        <td class="num">${fmtPct(r.hookRate)}</td>
        <td class="num">${fmtPct(r.holdRate)}</td>
        <td class="num">${r.vendas}</td>
        <td class="num"><b>${r.vendas?fmtBRL(r.cpa):'—'}</b></td>
        <td class="num" style="color:${r.roas>=2?'var(--gold-2)':'var(--txt)'}">${r.roas.toFixed(2)}x</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${fmtBRL(tot.investimento)}</td>
        <td class="num">${fmtN(tot.conversas)}</td><td class="num">—</td><td class="num">—</td>
        <td class="num">—</td><td class="num">—</td><td class="num">—</td>
        <td class="num">${tot.vendas}</td>
        <td class="num">${tot.vendas?fmtBRL(tot.investimento/tot.vendas):'—'}</td>
        <td class="num">${tot.investimento?(tot.rec/tot.investimento).toFixed(2):'0.00'}x</td></tr></tfoot>
    </table></div>`;
  }

  function accountPerfTable(){
    const rows=S.accounts.map(a=>{
      const tf=S.trafego.filter(t=>inRange(t.data)&&t.accountId===a.id);
      const sl=S.sales.filter(s=>inRange(s.data)&&s.accountId===a.id&&s.status==='aprovada');
      const ag=aggTraf(tf);
      const recPayt=sl.reduce((x,s)=>x+(+s.valor||0),0);
      const vendas = sl.length>0? sl.length : ag.comprasMeta;
      const rec = sl.length>0? recPayt : ag.valorComprasMeta;
      return {a,inv:ag.investimento,rec,vendas,roas:ag.investimento?rec/ag.investimento:0};
    });
    if(!rows.some(r=>r.inv||r.rec)) return emptyBox('Sem dados no período.');
    const max=Math.max(...rows.map(r=>r.roas),0.01);
    return `<div class="tbl-wrap"><table><thead><tr><th>Conta</th><th class="num">Invest.</th>
      <th class="num">Receita</th><th class="num">Vendas</th><th class="num">ROAS</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="row">
        <td><b>${esc(r.a.nome)}</b></td>
        <td class="num">${fmtBRL(r.inv)}</td>
        <td class="num" style="color:var(--gold-2)">${fmtBRL(r.rec)}</td>
        <td class="num">${fmtN(r.vendas)}</td>
        <td class="num"><b>${r.roas.toFixed(2)}x</b>
          <div class="mini-bar"><i style="width:${Math.min(100,r.roas/max*100)}%"></i></div></td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  function funnelView(k){
    const stages=[['💬 Conversas',k.conversas,'#6b9fc0'],
      ['🛒 Compras',k.comprasPlataforma,'#e0aa45'],
      ['✅ Aprovadas',k.comprasAprov,'#3fae6b']];
    const max=Math.max(...stages.map(s=>s[1]),1);
    return `<div style="display:flex;flex-direction:column;gap:14px">
      ${stages.map(([lbl,vv,c],i)=>{
        const prev=i>0?stages[i-1][1]:vv;
        const conv=prev?(vv/prev*100):100;
        return `<div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">
            <span style="color:var(--txt-2)">${lbl}</span>
            <span><b>${fmtN(vv)}</b> ${i>0?`<span style="color:var(--txt-3)">· ${conv.toFixed(0)}%</span>`:''}</span></div>
          <div class="mini-bar" style="height:22px"><i style="width:${vv/max*100}%;background:${c}"></i></div>
        </div>`;
      }).join('')}
      <div style="border-top:1px solid var(--line-soft);padding-top:12px;font-size:11.5px;color:var(--txt-3)">
        Custo/conversa <b style="color:var(--txt)">${fmtBRL(k.custoConversa)}</b> ·
        CPA <b style="color:var(--txt)">${fmtBRL(k.cpa)}</b></div>
    </div>`;
  }

  function contasPlanilha(){

      const recPayt=sl.reduce((x,s)=>x+(+s.valor||0),0);

      return {a,ag,rec,vendas,
        roas:ag.investimento?rec/ag.investimento:0,

        <th class="num">💬 Conversas</th>

        <th class="num">🎬 Hook Rate</th>

        <th class="num">🖱️ CTR</th>

          font-size:12.5px;color:var(--txt-3)">

  // ---------- CRIATIVOS / COPY (editor duplo) ----------
  function ensureDocs(){
    if(!S.docs) S.docs=[];
    if(!S.docs.length){
      S.docs.push({id:uid(),nome:'Copy 1',html:'',status:'teste',at:Date.now()});
      S.docs.push({id:uid(),nome:'Copy 2',html:'',status:'teste',at:Date.now()});
    }
    S.docs.forEach(d=>{if(!d.status)d.status='teste';});
    if(!docLeft||!S.docs.find(d=>d.id===docLeft)) docLeft=S.docs[0].id;
    if(!docRight||!S.docs.find(d=>d.id===docRight)) docRight=S.docs[Math.min(1,S.docs.length-1)].id;
  }
  function docSelect(side){
    const cur=side==='L'?docLeft:docRight;
    return `<select class="ctl" data-doc-select="${side}">
      ${S.docs.map(d=>`<option value="${d.id}" ${d.id===cur?'selected':''}>${esc(d.nome)}</option>`).join('')}
    </select>`;
  }
  function editorPane(side){
    const id=side==='L'?docLeft:docRight;
    const doc=S.docs.find(d=>d.id===id)||S.docs[0];
    const fmt=[
      ['bold','𝐁','Negrito'],['italic','𝘐','Itálico'],['underline','U̲','Sublinhado'],
      ['strikeThrough','S̶','Riscado']
    ];
    return `<div style="display:flex;flex-direction:column;background:var(--panel);
      border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)">
      <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap">
        ${docSelect(side)}
        <input class="ctl" data-doc-rename="${side}" value="${esc(doc.nome)}"
          style="flex:1;min-width:60px" placeholder="Nome do doc">
        <select class="ctl" data-doc-status="${side}">
          <option value="teste" ${doc.status==='teste'?'selected':''}>🧪 Em Teste</option>
          <option value="modelada" ${doc.status==='modelada'?'selected':''}>✏️ Modelada</option>

        </select>

        <button class="btn sm danger" data-doc-del="${side}">🗑️</button>
      </div>
      <div class="copytoolbar" style="display:flex;flex-wrap:wrap;gap:3px;padding:7px 10px;
        border-bottom:1px solid var(--line-soft);background:var(--panel-2)">
        ${fmt.map(([cmd,lbl,t])=>`<button class="ebtn" data-cmd="${cmd}" data-side="${side}" title="${t}">${lbl}</button>`).join('')}
        <span style="width:1px;background:var(--line);margin:2px 4px"></span>
        <button class="ebtn" data-cmd="formatBlock" data-val="h2" data-side="${side}" title="Título">H</button>
        <button class="ebtn" data-cmd="insertUnorderedList" data-side="${side}" title="Lista">•</button>
        <span style="width:1px;background:var(--line);margin:2px 4px"></span>
        <button class="ebtn" data-color="#e0655c" data-side="${side}" title="Vermelho"
          style="background:#e0655c">A</button>
        <button class="ebtn" data-color="#3fae6b" data-side="${side}" title="Verde"
          style="background:#3fae6b">A</button>
        <button class="ebtn" data-color="#5b8fb0" data-side="${side}" title="Azul"
          style="background:#5b8fb0">A</button>
        <button class="ebtn" data-color="#b08920" data-side="${side}" title="Dourado"
          style="background:#b08920">A</button>
        <span style="width:1px;background:var(--line);margin:2px 4px"></span>
        <button class="ebtn" data-hilite="#fff3a0" data-side="${side}" title="Destaque amarelo"
          style="background:#fff3a0;color:#000">🖍️</button>
        <button class="ebtn" data-hilite="#b6e7c9" data-side="${side}" title="Destaque verde"

  function viewCriativos(){

    return `

  function copyList(){
    if(!S.docs||!S.docs.length) return emptyBox('Nenhuma copy salva ainda.');
    const stInfo={
      validada:['green','✅ Validada'],
      modelada:['amber','✏️ Modelada'],
      teste:['blue','🧪 Em Teste']
    };
    // ordena: validada > modelada > teste, depois mais recente
    const rank={validada:0,modelada:1,teste:2};
    const docs=S.docs.slice().sort((a,b)=>{
      const r=(rank[a.status]??2)-(rank[b.status]??2);
      return r!==0?r:(b.at||0)-(a.at||0);
    });
    return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px">
      ${docs.map(d=>{
        const [cor,lbl]=stInfo[d.status]||stInfo.teste;
        const txt=(d.html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        const preview=txt?txt.slice(0,90)+(txt.length>90?'…':''):'(vazio)';
        return `<div style="background:var(--panel-2);border:1px solid var(--line-soft);
          border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;align-items:center;gap:7px">
            <b style="font-size:13px;flex:1">${esc(d.nome)}</b>
            <span class="pill ${cor}" style="padding:2px 8px">${lbl}</span>
          </div>
          <div style="font-size:11px;color:var(--txt-3);line-height:1.5;min-height:32px">${esc(preview)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn sm" data-copy-open-l="${d.id}" style="flex:1">◧ Abrir esquerda</button>
            <button class="btn sm" data-copy-open-r="${d.id}" style="flex:1">Abrir direita ◨</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

  function importCsv(){
    const raw=V('m_csv');if(!raw){toast('Cole o CSV');return;}
    const lines=raw.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast('CSV vazio');return;}
    const head=lines[0].split(',').map(h=>h.trim().toLowerCase());
    let n=0;
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(',').map(x=>x.trim());
      const get=name=>{const idx=head.indexOf(name);return idx>=0?(c[idx]||''):'';};
      const acc=S.accounts.find(a=>a.nome.toLowerCase()===get('conta').toLowerCase());
      S.sales.push({id:uid(),data:get('data')||today(),
        accountId:acc?acc.id:(S.accounts[0]&&S.accounts[0].id),
        produto:get('produto')||'—',cliente:get('cliente'),
        valor:parseFloat((get('valor')||'0').replace(',','.'))||0,
        status:(get('status')||'aprovada').toLowerCase(),tipo:(get('tipo')||'').toLowerCase()});
      n++;
    }
    closeModal();persist();toast('✅ '+n+' venda(s) importada(s)');
  }

    try{const obj=JSON.parse(V('m_json'));

      closeModal();persist();toast('✅ Backup importado');

  // ================= SYNC =================
  function fnUrl(name){
    return (S.config.backendUrl||'').replace(/\/+$/,'')+'/.netlify/functions/'+name;
  }
  function mergeBackend(d){
    const localTipo={};
    S.sales.forEach(s=>{if(s.source==='webhook')localTipo[s.id]=s.tipo;});
    S.sales=S.sales.filter(s=>s.source!=='webhook')
      .concat((d.sales||[]).map(s=>({...s,source:'webhook',tipo:s.tipo||localTipo[s.id]||''})));
    S.orders=S.orders.filter(o=>o.source!=='webhook')
      .concat((d.orders||[]).map(o=>({...o,source:'webhook'})));
    S.ctwa=S.ctwa.filter(c=>c.source!=='webhook')
      .concat((d.ctwa||[]).map(c=>({...c,source:'webhook',enviadoMeta:c.capiLead||c.enviadoMeta||false})));
  }
  async function syncBackend(silent){
    if(!S.config.backendUrl){if(!silent)toast('Configure a URL do backend primeiro');return;}
    syncState={status:'syncing',at:null};if(!silent)render();
    try{
      const r=await fetch(fnUrl('data')+'?token='+encodeURIComponent(S.config.token||''));
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(d.error)throw new Error(d.error);
      mergeBackend(d);
      syncState={status:'ok',at:new Date()};
      await save();render();
      if(!silent)toast('✅ Vendas e pedidos sincronizados');
    }catch(e){
      syncState={status:'err',at:new Date()};render();
      if(!silent)toast('Falha: '+e.message);
    }
  }
  async function syncMeta(preset,silent){
    if(!S.config.backendUrl){if(!silent)toast('Configure a URL do backend primeiro');return;}
    syncState={status:'syncing',at:null};if(!silent)render();
    const tk=encodeURIComponent(S.config.token||'');
    const pr=preset||'last_30d';
    function aplica(campaigns){
      const dates=new Set();
      (campaigns||[]).forEach(c=>(c.days||[]).forEach(x=>dates.add(x.date)));
      const metaIds=new Set((campaigns||[]).map(c=>String(c.metaId)));
      // só remove tráfego das datas E contas que voltaram nesta chamada
      S.trafego=S.trafego.filter(t=>{
        if(t.source!=='meta')return true;
        const acc=S.accounts.find(a=>a.id===t.accountId);
        return !(acc&&metaIds.has(String(acc.metaId))&&dates.has(t.data));
      });
      (campaigns||[]).forEach(c=>{
        const acc=S.accounts.find(a=>a.metaId===String(c.metaId));
        if(!acc)return;
        (c.days||[]).forEach(day=>{
          S.trafego.push({id:uid(),data:day.date,accountId:acc.id,
            campaignId:c.campaignId,campaignName:c.campaignName,
            investimento:+day.investimento||0,conversas:+day.conversas||0,
            compras:+day.compras||0,valorCompras:+day.valorCompras||0,
            impressions:+day.impressions||0,clicks:+day.clicks||0,linkClicks:+day.linkClicks||0,
            vPlay:+day.vPlay||0,vP25:+day.vP25||0,vP100:+day.vP100||0,vThru:+day.vThru||0,
            source:'meta'});
        });
      });
    }
    try{
      // puxa UMA conta por vez (evita o timeout 502 do Netlify)
      const first=S.accounts[0]?S.accounts[0].metaId:'';
      const r0=await fetch(fnUrl('meta-sync')+'?token='+tk+'&preset='+pr+'&acc='+encodeURIComponent(first));
      if(!r0.ok)throw new Error('HTTP '+r0.status);
      const d0=await r0.json();
      if(d0.error)throw new Error(d0.error);
      aplica(d0.campaigns);
      for(const mid of (d0.accountsAll||[])){
        if(mid===first)continue;
        const r=await fetch(fnUrl('meta-sync')+'?token='+tk+'&preset='+pr+'&acc='+encodeURIComponent(mid));
        if(!r.ok)continue;
        const d=await r.json();
        if(!d.error)aplica(d.campaigns);
      }
      syncState={status:'ok',at:new Date()};
      await save();render();
      if(!silent)toast('✅ Meta Ads sincronizado');
    }catch(e){
      syncState={status:'err',at:new Date()};render();
      if(!silent)toast('Falha Meta: '+e.message);
    }
  }
  let pollTimer=null;
  function startPolling(){
    if(pollTimer)clearInterval(pollTimer);
    if(!S.config.backendUrl)return;
    pollTimer=setInterval(async()=>{
      if(document.hidden)return;
      await syncBackend(true);
      await syncMeta('today',true);
    },180000);
  }

  // ================= DRAG & DROP =================
  function applyDrop(cardKey,dropKey){
    const [ctype,cid]=cardKey.split(':');
    const [field,value]=dropKey.split(':');
    if(ctype==='sale'){
      const s=S.sales.find(x=>x.id===cid);
      if(s&&field==='tipo'){s.tipo=value;persist();}
    }else if(ctype==='order'){
      const o=S.orders.find(x=>x.id===cid);
      if(o&&field==='status'){o.status=value;persist();}
    }
  }

  // ================= WIRE =================
  function wire(){
    document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;modal=null;render();});
    document.querySelectorAll('[data-tab]').forEach(b=>{
      if(b.classList.contains('nav'))return;
      b.onclick=()=>{tab=b.dataset.tab;render();};
    });
    document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions(b.dataset.act));
    document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{
      S.config.theme=b.dataset.theme;persist();
    });
    const seg=document.getElementById('rangeSeg');
    if(seg)seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const v=b.dataset.r;
      if(v==='custom'){modalCustom();return;}
      customRange=null;
      filterRange=(v==='all'||v==='today'||v==='yesterday')?v:+v;
      render();
    });
    const af=document.getElementById('accFilter');
    if(af)af.onchange=()=>{filterAcc=af.value;render();};
    const del=(sel,arr,word)=>document.querySelectorAll(sel).forEach(b=>{
      const attr=b.attributes[0].name;
      b.onclick=()=>{S[arr]=S[arr].filter(x=>x.id!==b.getAttribute(attr));persist();toast(word+' removido');};
    });
    del('[data-del-sale]','sales','Venda');
    del('[data-del-order]','orders','Pedido');
    del('[data-del-ctwa]','ctwa','Registro');
    del('[data-del-task]','tasks','Tarefa');
    document.querySelectorAll('[data-done-task]').forEach(b=>b.onclick=()=>{
      const t=(S.tasks||[]).find(x=>x.id===b.dataset.doneTask);
      if(t){t.done=true;t.feitaEm=Date.now();persist();toast('✅ Tarefa concluída!');}
    });
    document.querySelectorAll('[data-toggle-ctwa]').forEach(b=>b.onclick=()=>{
      const c=S.ctwa.find(x=>x.id===b.dataset.toggleCtwa);
      if(c){c.enviadoMeta=!c.enviadoMeta;persist();}
    });
    const ov=document.getElementById('ov');
    if(ov)ov.onclick=e=>{if(e.target===ov)closeModal();};
    document.querySelectorAll('.kcard').forEach(card=>{
      card.ondragstart=()=>{drag=card.dataset.card;card.classList.add('drag');};
      card.ondragend=()=>{card.classList.remove('drag');drag=null;};
    });
    document.querySelectorAll('[data-drop]').forEach(col=>{
      col.ondragover=e=>{e.preventDefault();col.classList.add('over');};
      col.ondragleave=()=>col.classList.remove('over');
      col.ondrop=e=>{e.preventDefault();col.classList.remove('over');
        if(drag)applyDrop(drag,col.dataset.drop);};
    });

    // ---- editor de copy ----
    function curDocId(side){return side==='L'?docLeft:docRight;}
    function editorEl(side){return document.querySelector(`[data-editor="${side}"]`);}
    function setSaveState(side,txt,cor){
      const el=document.querySelector(`[data-save-state="${side}"]`);
      if(el){el.textContent=txt;el.style.color=cor||'var(--txt-3)';}
    }
    // ao digitar: marca como "não salvo" (não grava — só salva no botão)
    document.querySelectorAll('[data-editor]').forEach(ed=>{
      ed.oninput=()=>setSaveState(ed.dataset.editor,'● não salvo','var(--amber)');
    });
    // SALVAR MANUAL — grava o conteúdo do editor no documento
    document.querySelectorAll('[data-doc-save]').forEach(b=>b.onclick=()=>{
      const side=b.dataset.docSave;
      const ed=editorEl(side); if(!ed)return;
      const d=S.docs.find(x=>x.id===curDocId(side));
      if(d){
        d.html=ed.innerHTML; d.at=Date.now();
        save();
        setSaveState(side,'✓ salvo','var(--green)');
        toast('💾 Copy salva na lista');
        // re-renderiza só a lista de baixo
        const lista=document.querySelector('[data-copylist]');
        if(lista) lista.innerHTML=copyList();
      }
    });
    // SALVAR COMO NOVA — cria uma copy nova com o conteúdo do editor
    document.querySelectorAll('[data-doc-saveas]').forEach(b=>b.onclick=()=>{
      const side=b.dataset.docSaveas;
      const ed=editorEl(side); if(!ed)return;
      if(!ed.innerHTML.trim()){toast('Editor vazio — escreva algo primeiro');return;}
      const nome=prompt('Nome da nova copy:','Copy '+(S.docs.length+1));
      if(nome===null)return;
      const novo={id:uid(),nome:nome.trim()||'Copy '+(S.docs.length+1),
        html:ed.innerHTML,status:'teste',at:Date.now()};
      S.docs.push(novo);
      if(side==='L')docLeft=novo.id; else docRight=novo.id;
      persist();
      toast('✨ Nova copy salva na lista');
    });
    // limpar editor (não apaga o salvo — só o rascunho na tela)
    document.querySelectorAll('[data-doc-clear]').forEach(b=>b.onclick=()=>{
      const ed=editorEl(b.dataset.docClear);
      if(ed && confirm('Limpar o texto do editor? (o que está salvo na lista continua)')){
        ed.innerHTML='';
        setSaveState(b.dataset.docClear,'● não salvo','var(--amber)');
      }
    });
    // botões de formatação
    document.querySelectorAll('.ebtn').forEach(b=>b.onclick=e=>{
      e.preventDefault();
      const side=b.dataset.side;
      const ed=editorEl(side); if(ed)ed.focus();
      if(b.dataset.color){ document.execCommand('foreColor',false,b.dataset.color); }
      else if(b.dataset.hilite){ document.execCommand('hiliteColor',false,b.dataset.hilite); }
      else if(b.dataset.cmd==='formatBlock'){ document.execCommand('formatBlock',false,b.dataset.val); }
      else if(b.dataset.cmd){ document.execCommand(b.dataset.cmd,false,null); }
      setSaveState(side,'● não salvo','var(--amber)');
    });
    // trocar documento no lado
    document.querySelectorAll('[data-doc-select]').forEach(s=>s.onchange=()=>{
      const side=s.dataset.docSelect;
      if(side==='L')docLeft=s.value; else docRight=s.value;
      render();
    });
    // renomear documento
    document.querySelectorAll('[data-doc-rename]').forEach(inp=>{
      inp.onchange=()=>{
        const d=S.docs.find(x=>x.id===curDocId(inp.dataset.docRename));
        if(d){d.nome=inp.value.trim()||'Sem nome';persist();}
      };
    });
    // novo documento
    document.querySelectorAll('[data-doc-new]').forEach(b=>b.onclick=()=>{
      const side=b.dataset.docNew;
      const novo={id:uid(),nome:'Copy '+(S.docs.length+1),html:'',status:'teste',at:Date.now()};
      S.docs.push(novo);
      if(side==='L')docLeft=novo.id; else docRight=novo.id;
      persist();toast('📄 Novo documento criado');
    });
    // copiar conteúdo do documento
    document.querySelectorAll('[data-doc-copy]').forEach(b=>b.onclick=async()=>{
      const ed=editorEl(b.dataset.docCopy);
      if(!ed)return;
      try{
        await navigator.clipboard.writeText(ed.innerText);
        toast('📋 Copy copiada!');
      }catch(e){
        // fallback: seleciona o texto
        const r=document.createRange();r.selectNodeContents(ed);
        const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
        document.execCommand('copy');sel.removeAllRanges();
        toast('📋 Copy copiada!');
      }
    });
    // apagar documento
    document.querySelectorAll('[data-doc-del]').forEach(b=>b.onclick=()=>{
      if(S.docs.length<=1){toast('Precisa ter ao menos 1 documento');return;}
      const id=curDocId(b.dataset.docDel);
      if(!confirm('Apagar este documento? Não dá pra desfazer.'))return;
      S.docs=S.docs.filter(d=>d.id!==id);
      docLeft=null;docRight=null;
      persist();toast('🗑️ Documento apagado');
    });
    // mudar status do documento
    document.querySelectorAll('[data-doc-status]').forEach(s=>s.onchange=()=>{
      const d=S.docs.find(x=>x.id===curDocId(s.dataset.docStatus));
      if(d){d.status=s.value;persist();toast('Status atualizado');}
    });
    // abrir copy da lista num dos lados
    document.querySelectorAll('[data-copy-open-l]').forEach(b=>b.onclick=()=>{
      docLeft=b.dataset.copyOpenL;render();
    });
    document.querySelectorAll('[data-copy-open-r]').forEach(b=>b.onclick=()=>{
      docRight=b.dataset.copyOpenR;render();
    });
  }

  // ================= BOOT =================
  async function boot(){
    document.getElementById('root').innerHTML=
      '<div class="loading"><div class="spin"></div>Carregando Apollo…</div>';
    await load();
    render();
    if(S.config.backendUrl){
      await syncBackend(true);
      // tráfego não é salvo no storage — repopula puxando 30 dias no boot
      syncMeta('last_30d',true).then(()=>syncMeta('today',true));
      startPolling();
    }
  }
  boot();
})();
</script>
