<!-- Apollo Company — Painel de Tráfego & Logística — V4 -->
<div id="root"></div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap');

  /* ---- TEMA ESCURO (padrão de variáveis, sobrescrito por .light) ---- */
  :root{
    --bg:#0a0a0c; --panel:#141417; --panel-2:#1b1b20; --panel-3:#222228;
    --line:rgba(212,175,55,.14); --line-soft:rgba(255,255,255,.07);
    --gold:#d4af37; --gold-2:#e8c860; --gold-dim:#9a8030;
    --txt:#f6f3ea; --txt-2:#c4c1b6; --txt-3:#928f84;
    --green:#3fae6b; --green-bg:rgba(63,174,107,.14);
    --red:#e0655c; --red-bg:rgba(224,101,92,.14);
    --amber:#e0aa45; --amber-bg:rgba(224,170,69,.14);
    --blue:#6b9fc0; --blue-bg:rgba(107,159,192,.14);
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .light{
    --bg:#f4f2ec; --panel:#ffffff; --panel-2:#f7f5ef; --panel-3:#eeebe1;
    --line:rgba(176,137,32,.28); --line-soft:rgba(0,0,0,.08);
    --gold:#b08920; --gold-2:#8a6a14; --gold-dim:#c9a542;
    --txt:#1f1d17; --txt-2:#54514a; --txt-3:#86837a;
    --green:#1f8d4f; --green-bg:rgba(31,141,79,.12);
    --red:#c0392b; --red-bg:rgba(192,57,43,.1);
    --amber:#b8860b; --amber-bg:rgba(184,134,11,.12);
    --blue:#3a6f8f; --blue-bg:rgba(58,111,143,.1);
    --shadow:0 6px 24px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  #root{font-family:'Sora',sans-serif;background:var(--bg);color:var(--txt);
    min-height:100vh;font-size:14px;line-height:1.5;transition:background .2s;
    background-image:radial-gradient(900px 500px at 80% -10%,rgba(212,175,55,.07),transparent),
      radial-gradient(700px 400px at -10% 110%,rgba(212,175,55,.04),transparent);}
  .light #root{background-image:radial-gradient(900px 500px at 80% -10%,rgba(176,137,32,.09),transparent),
      radial-gradient(700px 400px at -10% 110%,rgba(176,137,32,.05),transparent);}
  .app{display:flex;min-height:100vh}

  /* sidebar */
  .side{width:244px;flex-shrink:0;border-right:1px solid var(--line);
    padding:22px 14px;display:flex;flex-direction:column;gap:4px;
    background:linear-gradient(180deg,var(--panel),transparent);}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;}
  .brand .logo{width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    display:flex;align-items:center;justify-content:center;font-size:19px;}
  .brand b{font-size:14.5px;font-weight:800;letter-spacing:.2px;display:block}
  .brand span{font-size:9.5px;color:var(--txt-3);letter-spacing:1.6px;text-transform:uppercase;display:block;margin-top:1px}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;
    color:var(--txt-2);cursor:pointer;font-weight:500;font-size:13px;transition:.14s;border:1px solid transparent}
  .nav:hover{background:var(--panel-2);color:var(--txt)}
  .nav.on{background:linear-gradient(90deg,rgba(212,175,55,.18),rgba(212,175,55,.05));
    color:var(--gold-2);border-color:var(--line);font-weight:600}
  .light .nav.on{background:linear-gradient(90deg,rgba(176,137,32,.16),rgba(176,137,32,.04))}
  .nav .ic{width:18px;text-align:center;font-size:15px}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
    font-weight:700;padding:1px 6px;border-radius:20px}
  .side-foot{margin-top:auto;font-size:10px;color:var(--txt-3);padding:14px 8px 0;border-top:1px solid var(--line-soft)}
  .theme-toggle{display:flex;gap:6px;margin:8px 4px 0}
  .theme-toggle button{flex:1;background:var(--panel-2);border:1px solid var(--line-soft);
    color:var(--txt-2);padding:7px;border-radius:8px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:600;transition:.14s}
  .theme-toggle button.on{background:var(--gold);color:#1a1500;border-color:transparent}

  /* main */
  .main{flex:1;padding:26px 30px;overflow:auto;max-height:100vh}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .topbar h1{font-size:22px;font-weight:800}
  .topbar .sub{font-size:12px;color:var(--txt-3);margin-top:2px}
  .spacer{flex:1}

  /* controles */
  .ctl{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--txt);padding:8px 11px;font-family:inherit;font-size:12.5px;outline:none}
  .ctl:focus{border-color:var(--gold)}
  select.ctl{cursor:pointer}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--txt);
    padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:12.5px;
    font-weight:500;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel-2);border-color:var(--gold)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    color:#1a1500;border-color:transparent;font-weight:700}
  .btn.gold:hover{filter:brightness(1.08)}
  .btn.sm{padding:5px 10px;font-size:11.5px}
  .btn.danger{color:var(--red);border-color:var(--red-bg)}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px 17px;
    position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--gold),transparent)}
  .kpi .lbl{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .kpi .val{font-size:25px;font-weight:800;margin-top:9px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .val.gold{color:var(--gold-2)}
  .kpi .hint{font-size:10.5px;color:var(--txt-3);margin-top:4px}
  .kpi.hero{background:linear-gradient(135deg,rgba(212,175,55,.14),var(--panel))}
  .light .kpi.hero{background:linear-gradient(135deg,rgba(176,137,32,.1),var(--panel))}

  /* card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:18px;margin-bottom:18px;box-shadow:var(--shadow)}
  .card h2{font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:9px}
  .card .desc{font-size:12px;color:var(--txt-2);margin-bottom:14px;line-height:1.6}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .card-head h2{margin:0}

  /* tabela */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--txt-2);font-weight:700;font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1px solid var(--line);
    white-space:nowrap}
  td{padding:10px;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tr.row:hover td{background:var(--panel-2)}
  .num{text-align:right}
  tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;color:var(--gold-2)}

  /* pill */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
    font-size:10.5px;font-weight:700;white-space:nowrap}
  .pill.green{background:var(--green-bg);color:var(--green)}
  .pill.red{background:var(--red-bg);color:var(--red)}
  .pill.amber{background:var(--amber-bg);color:var(--amber)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.gold{background:rgba(212,175,55,.14);color:var(--gold-2)}
  .pill.gray{background:var(--panel-3);color:var(--txt-2)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
  .col{flex:1;min-width:230px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:13px;padding:12px;display:flex;flex-direction:column}
  .col.over{border-color:var(--gold);background:rgba(212,175,55,.06)}
  .col-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding:0 3px}
  .col-head b{font-size:12px;font-weight:700}
  .col-head .ct{margin-left:auto;font-size:10.5px;color:var(--txt-3);
    background:var(--panel-3);padding:1px 8px;border-radius:20px;font-weight:700}
  .col-body{display:flex;flex-direction:column;gap:9px;min-height:60px;flex:1}
  .kcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    padding:11px;cursor:grab;transition:.12s}
  .kcard:hover{border-color:var(--gold)}
  .kcard.drag{opacity:.4}
  .kcard .kname{font-weight:700;font-size:12.5px}
  .kcard .kmeta{font-size:10.5px;color:var(--txt-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .kcard .kval{color:var(--gold-2);font-weight:700;font-variant-numeric:tabular-nums}
  .col-empty{font-size:11px;color:var(--txt-3);text-align:center;padding:18px 0;
    border:1px dashed var(--line-soft);border-radius:9px}

  /* form */
  .form{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .form .full{grid-column:span 2}
  .fld label{display:block;font-size:10.5px;color:var(--txt-3);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .fld input,.fld select,.fld textarea{width:100%;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;color:var(--txt);
    padding:8px 10px;font-family:inherit;font-size:12.5px;outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--gold)}
  .fld textarea{resize:vertical;min-height:80px}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
    display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:22px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .modal h3{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

  .empty{text-align:center;padding:40px 20px;color:var(--txt-3)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--txt-3);gap:10px}
  .spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--gold);border-radius:10px;
    padding:11px 18px;font-size:12.5px;z-index:99;box-shadow:var(--shadow);animation:up .25s ease;color:var(--txt)}
  @keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  @media(max-width:980px){.split{grid-template-columns:1fr}}
  @media(max-width:880px){.side{width:66px}.brand b,.brand span,.nav span:not(.ic):not(.badge),.side-foot,.theme-toggle{display:none}.nav{justify-content:center}}
  .mini-bar{height:6px;border-radius:4px;background:var(--panel-3);overflow:hidden;margin-top:8px}
  .mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
  .seg button{background:none;border:none;color:var(--txt-2);padding:5px 11px;border-radius:6px;
    cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700}
  .seg button.on{background:var(--gold);color:#1a1500}
  code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-size:11.5px;color:var(--gold-2);
    border:1px solid var(--line-soft)}
</style>
<script>
(function(){
  "use strict";
  const K='apollodash:state';
  const fmtBRL=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const fmtN=n=>(n||0).toLocaleString('pt-BR');
  const fmtPct=n=>(n||0).toFixed(2)+'%';
  const uid=()=>Math.random().toString(36).slice(2,9);
  const today=()=>new Date().toISOString().slice(0,10);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- estado padrão ----
  const DEFAULT={
    accounts:[
      {id:'a1',nome:'AP CA08',metaId:'1479485729200192',status:'ativa'},
      {id:'a2',nome:'Contingência Black',metaId:'993400546343835',status:'ativa'}
    ],
    trafego:[], sales:[], orders:[], ctwa:[],
    config:{backendUrl:'',token:'',theme:'light'}
  };

  let S=JSON.parse(JSON.stringify(DEFAULT));
  let tab='dash', modal=null, filterAcc='all', filterRange=7, drag=null;
  let syncState={status:'idle',at:null};
  let customRange=null; // {de,ate}

  // ---- storage ----
  async function load(){
    try{const r=await window.storage.get(K);
      if(r&&r.value) S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(r.value));
    }catch(e){}
  }
  async function save(){
    try{await window.storage.set(K,JSON.stringify(S));}
    catch(e){toast('Erro ao salvar — '+e.message);}
  }
  function persist(){save();render();}

  // ---- toast ----
  let toastT;
  function toast(msg){
    const old=document.querySelector('.toast'); if(old) old.remove();
    const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800);
  }

  // ---- filtro de período ----
  function inRange(dateStr){
    if(customRange) return dateStr>=customRange.de && dateStr<=customRange.ate;
    if(filterRange==='all') return true;
    if(filterRange==='today') return dateStr===today();
    const d=new Date(dateStr+'T12:00'), now=new Date();
    const diff=(now-d)/86400000;
    return diff<=filterRange && diff>=-1;
  }
  function accOk(id){return filterAcc==='all'||id===filterAcc;}
  function rangeLabel(){
    if(customRange) return customRange.de+' a '+customRange.ate;
    if(filterRange==='today') return 'Hoje';
    if(filterRange==='all') return 'Todo o período';
    return 'Últimos '+filterRange+' dias';
  }

  // ---- métricas agregadas de uma lista de tráfego ----
  function aggTraf(list){
    const a={investimento:0,conversas:0,comprasMeta:0,valorComprasMeta:0,
      impressions:0,clicks:0,linkClicks:0,vPlay:0,vP25:0,vP100:0,vThru:0};
    list.forEach(t=>{
      a.investimento+=+t.investimento||0; a.conversas+=+t.conversas||0;
      a.comprasMeta+=+t.compras||0; a.valorComprasMeta+=+t.valorCompras||0;
      a.impressions+=+t.impressions||0; a.clicks+=+t.clicks||0; a.linkClicks+=+t.linkClicks||0;
      a.vPlay+=+t.vPlay||0; a.vP25+=+t.vP25||0; a.vP100+=+t.vP100||0; a.vThru+=+t.vThru||0;
    });
    // derivadas
    a.cpm = a.impressions? (a.investimento/a.impressions*1000):0;
    a.ctr = a.impressions? (a.linkClicks/a.impressions*100):0;
    a.hookRate = a.vPlay? (a.vP25/a.vPlay*100):0;       // % que passou de 25%
    a.holdRate = a.vPlay? (a.vP100/a.vPlay*100):0;      // % que viu até o fim
    a.custoConversa = a.conversas? (a.investimento/a.conversas):0;
    a.convPorMsg = a.linkClicks? (a.conversas/a.linkClicks):0;
    return a;
  }

  // ---- KPIs do dashboard ----
  function kpis(){
    const tf=S.trafego.filter(t=>inRange(t.data)&&accOk(t.accountId));
    const sl=S.sales.filter(s=>inRange(s.data)&&accOk(s.accountId));
    const a=aggTraf(tf);
    const aprov=sl.filter(s=>s.status==='aprovada');
    const receita=aprov.reduce((x,s)=>x+(+s.valor||0),0);
    const receitaTotal=sl.reduce((x,s)=>x+(+s.valor||0),0);
    const comprasAprov=aprov.length;
    return {
      ...a,
      comprasPlataforma:sl.length, comprasAprov,
      receita, receitaTotal,
      roas: a.investimento? receita/a.investimento:0,
      ticket: comprasAprov? receita/comprasAprov:0,
      cpa: comprasAprov? a.investimento/comprasAprov:0,
      taxaAprov: sl.length? comprasAprov/sl.length*100:0,
      leadsPorVenda: comprasAprov? a.conversas/comprasAprov:0
    };
  }

  // ================= RENDER =================
  function render(){
    const root=document.getElementById('root');
    document.documentElement.className = S.config.theme==='light'?'light':'';
    root.className = S.config.theme==='light'?'light':'';
    root.innerHTML=`<div class="app">${sidebar()}<div class="main">${view()}</div></div>${modal||''}`;
    wire();
  }

  function sidebar(){
    const items=[
      ['dash','🚀','Dashboard',0],
      ['contas','📊','Contas de Anúncio',0],
      ['vendas','💰','Vendas / WebHook',0],
      ['afterpay','🔄','Kanban After Pay',S.sales.filter(s=>!s.tipo).length],
      ['pedidos','📦','Kanban Pedidos',S.orders.filter(o=>o.status==='problema').length],
      ['ctwa','💬','WhatsApp CTWA',S.ctwa.filter(c=>!c.enviadoMeta).length],
      ['config','⚙️','Configurações',0]
    ];
    return `<div class="side">
      <div class="brand">
        <div class="logo">🚀</div>
        <div><b>Apollo Company</b><span>Tráfego & Logística</span></div>
      </div>
      ${items.map(([id,ic,lbl,bd])=>`
        <div class="nav ${tab===id?'on':''}" data-tab="${id}">
          <span class="ic">${ic}</span><span>${lbl}</span>
          ${bd?`<span class="badge">${bd}</span>`:''}
        </div>`).join('')}
      <div class="theme-toggle">
        <button data-theme="light" class="${S.config.theme==='light'?'on':''}">☀️ Claro</button>
        <button data-theme="dark" class="${S.config.theme==='dark'?'on':''}">🌙 Escuro</button>
      </div>
      <div class="side-foot">Apollo V4 🚀<br>${S.config.backendUrl?'Sincronizado ao vivo':'Modo manual'}</div>
    </div>`;
  }

  function syncBadge(){
    const m={idle:['gray','aguardando'],syncing:['amber','atualizando…'],
      ok:['green','ao vivo'],err:['red','erro']};
    const [c,t]=m[syncState.status]||m.idle;
    const when=syncState.at?' · '+syncState.at.toLocaleTimeString('pt-BR').slice(0,5):'';
    return `<span class="pill ${c}"><span class="dot"></span>${t}${when}</span>`;
  }

  function rangeBar(){
    return `<div class="seg" id="rangeSeg">
      ${[['today','Hoje'],[7,'7d'],[15,'15d'],[30,'30d'],[90,'90d'],['all','Tudo']].map(([v,l])=>
        `<button data-r="${v}" class="${!customRange&&String(filterRange)===String(v)?'on':''}">${l}</button>`).join('')}
      <button data-r="custom" class="${customRange?'on':''}">📅 Período</button>
    </div>
    <select class="ctl" id="accFilter">
      <option value="all">🌐 Todas as contas</option>
      ${S.accounts.map(a=>`<option value="${a.id}" ${filterAcc===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}
    </select>`;
  }

  function view(){
    return ({dash:viewDash,contas:viewContas,vendas:viewVendas,afterpay:viewAfterpay,
      pedidos:viewPedidos,ctwa:viewCtwa,config:viewConfig}[tab]||viewDash)();
  }

  // ---------- DASHBOARD ----------
  function viewDash(){
    const k=kpis();
    return `
    <div class="topbar">
      <div><h1>🚀 Dashboard</h1>
        <div class="sub">${rangeLabel()} · ${S.config.backendUrl?'sincroniza a cada 3 min':'modo manual'}</div></div>
      <div class="spacer"></div>
      ${S.config.backendUrl?`${syncBadge()}<button class="btn" data-act="syncNow">↻ Atualizar</button>`:''}
      ${rangeBar()}
    </div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">💬 Conversas iniciadas</div>
        <div class="val">${fmtN(k.conversas)}</div><div class="hint">leads no WhatsApp</div></div>
      <div class="kpi"><div class="lbl">💵 Custo por conversa</div>
        <div class="val">${fmtBRL(k.custoConversa)}</div><div class="hint">investimento ÷ conversas</div></div>
      <div class="kpi"><div class="lbl">🛒 Compras (Payt)</div>
        <div class="val">${fmtN(k.comprasPlataforma)}</div>
        <div class="hint">${fmtN(k.comprasMeta)} reportadas pela Meta</div></div>

  function campaignTable(){
    const tf=S.trafego.filter(t=>inRange(t.data)&&accOk(t.accountId)&&t.campaignId);
    const sl=S.sales.filter(s=>inRange(s.data)&&accOk(s.accountId)&&s.status==='aprovada');
    if(!tf.length) return emptyBox('🛰️ Sem dados de campanha. Rode "Sincronizar Meta Ads" em Configurações.');
    const map={};
    tf.forEach(t=>{
      const c=map[t.campaignId]||(map[t.campaignId]={nome:t.campaignName||t.campaignId,rows:[],vendas:0,rec:0});
      c.rows.push(t);
    });
    sl.filter(s=>s.campaignId).forEach(s=>{
      if(map[s.campaignId]){map[s.campaignId].vendas++;map[s.campaignId].rec+=+s.valor||0;}
    });
    const rows=Object.values(map).map(c=>{
      const a=aggTraf(c.rows);
      return {nome:c.nome,...a,vendas:c.vendas,rec:c.rec,
        cpa:c.vendas?a.investimento/c.vendas:0, roas:a.investimento?c.rec/a.investimento:0};
    }).sort((a,b)=>b.investimento-a.investimento);
    const tot=rows.reduce((t,r)=>{['investimento','conversas','vendas','rec'].forEach(k=>t[k]=(t[k]||0)+r[k]);return t;},{});
    return `<div class="tbl-wrap"><table>
      <thead><tr><th>Campanha</th><th class="num">Invest.</th><th class="num">Conversas</th>
      <th class="num">Custo/conv.</th><th class="num">CPM</th><th class="num">CTR</th>
      <th class="num">Hook</th><th class="num">Hold</th>
      <th class="num">Vendas</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="row">
        <td><b>${esc(r.nome)}</b></td>
        <td class="num">${fmtBRL(r.investimento)}</td>
        <td class="num">${fmtN(r.conversas)}</td>
        <td class="num">${fmtBRL(r.custoConversa)}</td>
        <td class="num">${fmtBRL(r.cpm)}</td>
        <td class="num">${fmtPct(r.ctr)}</td>
        <td class="num">${fmtPct(r.hookRate)}</td>
        <td class="num">${fmtPct(r.holdRate)}</td>
        <td class="num">${r.vendas}</td>
        <td class="num"><b>${r.vendas?fmtBRL(r.cpa):'—'}</b></td>
        <td class="num" style="color:${r.roas>=2?'var(--gold-2)':'var(--txt)'}">${r.roas.toFixed(2)}x</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${fmtBRL(tot.investimento)}</td>
        <td class="num">${fmtN(tot.conversas)}</td><td class="num">—</td><td class="num">—</td>
        <td class="num">—</td><td class="num">—</td><td class="num">—</td>
        <td class="num">${tot.vendas}</td>
        <td class="num">${tot.vendas?fmtBRL(tot.investimento/tot.vendas):'—'}</td>
        <td class="num">${tot.investimento?(tot.rec/tot.investimento).toFixed(2):'0.00'}x</td></tr></tfoot>
    </table></div>`;
  }

  function accountPerfTable(){
    const rows=S.accounts.map(a=>{
      const tf=S.trafego.filter(t=>inRange(t.data)&&t.accountId===a.id);
      const sl=S.sales.filter(s=>inRange(s.data)&&s.accountId===a.id&&s.status==='aprovada');
      const ag=aggTraf(tf);
      const rec=sl.reduce((x,s)=>x+(+s.valor||0),0);
      return {a,inv:ag.investimento,rec,vendas:sl.length,roas:ag.investimento?rec/ag.investimento:0};
    });
    if(!rows.some(r=>r.inv||r.rec)) return emptyBox('Sem dados no período.');
    const max=Math.max(...rows.map(r=>r.roas),0.01);
    return `<div class="tbl-wrap"><table><thead><tr><th>Conta</th><th class="num">Invest.</th>
      <th class="num">Receita</th><th class="num">Vendas</th><th class="num">ROAS</th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="row">
        <td><b>${esc(r.a.nome)}</b></td>
        <td class="num">${fmtBRL(r.inv)}</td>
        <td class="num" style="color:var(--gold-2)">${fmtBRL(r.rec)}</td>
        <td class="num">${r.vendas}</td>
        <td class="num"><b>${r.roas.toFixed(2)}x</b>
          <div class="mini-bar"><i style="width:${Math.min(100,r.roas/max*100)}%"></i></div></td>
      </tr>`).join('')}</tbody></table></div>`;
  }

  function funnelView(k){
    const stages=[['💬 Conversas',k.conversas,'#6b9fc0'],
      ['🛒 Compras',k.comprasPlataforma,'#e0aa45'],
      ['✅ Aprovadas',k.comprasAprov,'#3fae6b']];
    const max=Math.max(...stages.map(s=>s[1]),1);
    return `<div style="display:flex;flex-direction:column;gap:14px">
      ${stages.map(([lbl,vv,c],i)=>{
        const prev=i>0?stages[i-1][1]:vv;
        const conv=prev?(vv/prev*100):100;
        return `<div>
          <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px">
            <span style="color:var(--txt-2)">${lbl}</span>
            <span><b>${fmtN(vv)}</b> ${i>0?`<span style="color:var(--txt-3)">· ${conv.toFixed(0)}%</span>`:''}</span></div>
          <div class="mini-bar" style="height:22px"><i style="width:${vv/max*100}%;background:${c}"></i></div>
        </div>`;
      }).join('')}
      <div style="border-top:1px solid var(--line-soft);padding-top:12px;font-size:11.5px;color:var(--txt-3)">
        Custo/conversa <b style="color:var(--txt)">${fmtBRL(k.custoConversa)}</b> ·
        CPA <b style="color:var(--txt)">${fmtBRL(k.cpa)}</b></div>
    </div>`;
  }

        <button class="btn" data-act="importJson">⬆️ Importar backup</button>
        <button class="btn" data-act="seedDemo">✨ Dados de exemplo</button>
        <button class="btn danger" data-act="wipe">🗑️ Zerar tudo</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h2>🔗 Endpoints do backend</h2></div>
      <div class="desc">Configure estas URLs nos painéis da Payt, Red Rocket, PayLog e no app Meta:</div>
      <div class="tbl-wrap"><table><tbody>
        <tr class="row"><td><b>💰 WebHook Payt</b></td>
          <td><code>SEU-SITE/.netlify/functions/webhook-payt?token=SEU_TOKEN</code></td></tr>
        <tr class="row"><td><b>🚀 WebHook Red Rocket</b></td>
          <td><code>SEU-SITE/.netlify/functions/webhook-redrocket?token=SEU_TOKEN</code></td></tr>
        <tr class="row"><td><b>📦 WebHook PayLog</b></td>
          <td><code>SEU-SITE/.netlify/functions/webhook-paylog?token=SEU_TOKEN</code></td></tr>
        <tr class="row"><td><b>💬 WebHook CTWA</b></td>
          <td><code>SEU-SITE/.netlify/functions/webhook-ctwa?token=SEU_TOKEN</code></td></tr>
        <tr class="row"><td><b>🔍 Debug</b></td>
          <td><code>.../data?token=SEU_TOKEN&debug=1</code></td></tr>
      </tbody></table></div>
    </div>`;
  }

  // ================= MODAIS =================
  function openModal(html){modal=`<div class="ov" id="ov"><div class="modal">${html}</div></div>`;render();}
  function closeModal(){modal=null;render();}
  function accSelect(id,sel){
    return `<select id="${id}">${S.accounts.map(a=>
      `<option value="${a.id}" ${sel===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}</select>`;
  }
  function modalAccount(){
    openModal(`<h3>📊 Nova conta de anúncio</h3>
      <div class="form">
        <div class="fld full"><label>Nome</label><input id="m_nome" placeholder="Ex: AP CA08"></div>
        <div class="fld full"><label>ID Meta</label><input id="m_mid" placeholder="1479485729200192"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="saveAccount">Salvar</button></div>`);
  }
  function modalSale(){
    openModal(`<h3>💰 Nova venda</h3>
      <div class="form">
        <div class="fld"><label>Data</label><input type="date" id="m_data" value="${today()}"></div>
        <div class="fld"><label>Conta</label>${accSelect('m_acc')}</div>
        <div class="fld"><label>Produto</label><input id="m_prod" placeholder="Hepazol — Protocolo Completo"></div>
        <div class="fld"><label>Cliente</label><input id="m_cli" placeholder="Nome"></div>
        <div class="fld"><label>Valor (R$)</label><input id="m_val" type="number" step="0.01"></div>
        <div class="fld"><label>Status</label><select id="m_st">
          <option value="aprovada">Aprovada</option><option value="pendente">Pendente</option>
          <option value="recusada">Recusada</option></select></div>
        <div class="fld full"><label>Tipo</label><select id="m_tp">
          <option value="">A classificar</option><option value="upfront">Pagamento antecipado</option>
          <option value="afterpay">After Pay (contra-entrega)</option></select></div>
      </div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="saveSale">Salvar</button></div>`);
  }
  function modalOrder(){
    openModal(`<h3>📦 Novo pedido</h3>
      <div class="form">
        <div class="fld"><label>Cliente</label><input id="m_cli" placeholder="Nome"></div>
        <div class="fld"><label>Produto</label><input id="m_prod"></div>
        <div class="fld"><label>Valor (R$)</label><input id="m_val" type="number" step="0.01"></div>
        <div class="fld"><label>Status</label><select id="m_st">
          <option value="pendente">Pendente</option><option value="cobranca">Cobrança</option>
          <option value="postado">Postado</option><option value="transito">Em trânsito</option>
          <option value="entregue">Entregue</option><option value="problema">Problema</option></select></div>
        <div class="fld"><label>Transportadora</label><input id="m_tr" placeholder="Correios / PayLog"></div>
        <div class="fld"><label>Rastreio</label><input id="m_tk"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="saveOrder">Salvar</button></div>`);
  }
  function modalCtwa(){
    openModal(`<h3>💬 Registrar conversa CTWA</h3>
      <div class="form">
        <div class="fld"><label>Data</label><input type="date" id="m_data" value="${today()}"></div>
        <div class="fld"><label>Nome</label><input id="m_nome"></div>
        <div class="fld"><label>Telefone</label><input id="m_tel" placeholder="+55..."></div>
        <div class="fld"><label>ctwa_clid</label><input id="m_clid"></div>
      </div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="saveCtwa">Salvar</button></div>`);
  }
  function modalCustom(){
    const d=new Date(); const ate=today();
    const de=new Date(d.getTime()-30*86400000).toISOString().slice(0,10);
    openModal(`<h3>📅 Período personalizado</h3>
      <div class="form">
        <div class="fld"><label>De</label><input type="date" id="m_de" value="${customRange?customRange.de:de}"></div>
        <div class="fld"><label>Até</label><input type="date" id="m_ate" value="${customRange?customRange.ate:ate}"></div>
      </div>
      <div class="desc" style="margin-top:10px">💡 Para puxar meses atrás, sincronize a Meta com período amplo
      em Configurações (90d) e depois filtre aqui.</div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="saveCustom">Aplicar</button></div>`);
  }
  function modalImportCsv(){
    openModal(`<h3>⇪ Importar vendas via CSV</h3>
      <div class="desc">Colunas: <code>data,conta,produto,cliente,valor,status,tipo</code></div>
      <div class="fld"><label>CSV</label><textarea id="m_csv" style="min-height:150px;font-family:monospace"
        placeholder="data,conta,produto,cliente,valor,status,tipo&#10;2026-05-19,AP CA08,Hepazol,Maria,297,aprovada,upfront"></textarea></div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="doImportCsv">Importar</button></div>`);
  }
  function modalImportJson(){
    openModal(`<h3>⬆️ Importar backup</h3>
      <div class="desc">Cole o JSON exportado. Substitui todos os dados.</div>
      <div class="fld"><label>JSON</label><textarea id="m_json" style="min-height:150px;font-family:monospace"></textarea></div>
      <div class="modal-foot"><button class="btn" data-act="closeModal">Cancelar</button>
        <button class="btn gold" data-act="doImportJson">Importar</button></div>`);
  }

  // ================= AÇÕES =================
  const V=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  function actions(act){
    switch(act){
      case 'closeModal':closeModal();break;
      case 'addAccount':modalAccount();break;
      case 'addSale':modalSale();break;
      case 'addOrder':modalOrder();break;
      case 'addCtwa':modalCtwa();break;
      case 'importCsv':modalImportCsv();break;
      case 'importJson':modalImportJson();break;
      case 'saveAccount':
        if(!V('m_nome')){toast('Informe o nome');break;}
        S.accounts.push({id:uid(),nome:V('m_nome'),metaId:V('m_mid')||'—',status:'ativa'});
        closeModal();persist();toast('✅ Conta adicionada');break;
      case 'saveSale':
        if(!V('m_prod')){toast('Informe o produto');break;}
        S.sales.push({id:uid(),data:V('m_data'),accountId:V('m_acc'),produto:V('m_prod'),
          cliente:V('m_cli'),valor:+V('m_val')||0,status:V('m_st'),tipo:V('m_tp')});
        closeModal();persist();toast('✅ Venda registrada');break;
      case 'saveOrder':
        if(!V('m_cli')){toast('Informe o cliente');break;}
        S.orders.push({id:uid(),cliente:V('m_cli'),produto:V('m_prod'),valor:+V('m_val')||0,
          status:V('m_st'),transportadora:V('m_tr'),tracking:V('m_tk')});
        closeModal();persist();toast('✅ Pedido criado');break;
      case 'saveCtwa':
        S.ctwa.push({id:uid(),data:V('m_data'),nome:V('m_nome'),phone:V('m_tel'),
          clid:V('m_clid'),evento:'Conversa iniciada',enviadoMeta:false});
        closeModal();persist();toast('✅ Conversa registrada');break;
      case 'saveCustom':
        customRange={de:V('m_de'),ate:V('m_ate')};closeModal();toast('📅 Período aplicado');break;
      case 'saveBackend':
        S.config.backendUrl=V('backendUrl').replace(/\/+$/,'');
        S.config.token=V('backendToken');
        save();toast('💾 Conexão salva');startPolling();render();break;
      case 'syncNow':syncBackend(false);break;
      case 'syncMeta':syncMeta('last_30d',false);break;
      case 'doImportCsv':importCsv();break;
      case 'doImportJson':importJson();break;
      case 'exportJson':exportJson();break;
      case 'seedDemo':seedDemo();break;
      case 'wipe':
        if(confirm('Zerar TODOS os dados? Não dá pra desfazer.')){
          const th=S.config.theme;
          S=JSON.parse(JSON.stringify(DEFAULT));S.config.theme=th;persist();toast('Painel zerado');
        }break;
    }
  }

  function importCsv(){
    const raw=V('m_csv');if(!raw){toast('Cole o CSV');return;}
    const lines=raw.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast('CSV vazio');return;}
    const head=lines[0].split(',').map(h=>h.trim().toLowerCase());
    let n=0;
    for(let i=1;i<lines.length;i++){
      const c=lines[i].split(',').map(x=>x.trim());
      const get=name=>{const idx=head.indexOf(name);return idx>=0?(c[idx]||''):'';};
      const acc=S.accounts.find(a=>a.nome.toLowerCase()===get('conta').toLowerCase());
      S.sales.push({id:uid(),data:get('data')||today(),
        accountId:acc?acc.id:(S.accounts[0]&&S.accounts[0].id),
        produto:get('produto')||'—',cliente:get('cliente'),
        valor:parseFloat((get('valor')||'0').replace(',','.'))||0,
        status:(get('status')||'aprovada').toLowerCase(),tipo:(get('tipo')||'').toLowerCase()});
      n++;
    }
    closeModal();persist();toast('✅ '+n+' venda(s) importada(s)');
  }
  function importJson(){
    try{const obj=JSON.parse(V('m_json'));
      const th=S.config.theme;
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),obj);
      if(!S.config.theme) S.config.theme=th;
      closeModal();persist();toast('✅ Backup importado');
    }catch(e){toast('JSON inválido');}
  }
  function exportJson(){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='apollo-backup-'+today()+'.json';a.click();toast('⬇️ Backup baixado');
  }
  function seedDemo(){
    const d=n=>{const x=new Date();x.setDate(x.getDate()-n);return x.toISOString().slice(0,10);};
    S.trafego=[];
    const camps=[['c1','PELE — EU (CRIA 02)'],['c2','JHONNY FAFA 1-3-1'],['c3','GABRIEL — FAFA (H1)']];
    for(let i=0;i<14;i++) S.accounts.forEach(acc=>camps.forEach(([cid,cn])=>{
      const imp=Math.round(8000+Math.random()*30000);
      const vp=Math.round(imp*0.4);
      S.trafego.push({id:uid(),data:d(i),accountId:acc.id,campaignId:cid,campaignName:cn,
        investimento:Math.round(200+Math.random()*600),conversas:Math.round(10+Math.random()*60),
        compras:Math.round(Math.random()*8),valorCompras:Math.round(Math.random()*2000),
        impressions:imp,clicks:Math.round(imp*0.03),linkClicks:Math.round(imp*0.018),
        vPlay:vp,vP25:Math.round(vp*0.55),vP100:Math.round(vp*0.18),vThru:Math.round(vp*0.3),source:'meta'});
    }));
    const prods=['Hepazol — Protocolo Completo','Hepazol — Protocolo Intensivo','SOS Gastrite Zero'];
    const nomes=['Maria S.','Conceição R.','Reginaldo P.','Marlene A.','José C.'];
    S.sales=[];
    for(let i=0;i<50;i++){
      const st=Math.random()<0.72?'aprovada':(Math.random()<0.6?'pendente':'recusada');
      S.sales.push({id:uid(),data:d(Math.floor(Math.random()*14)),
        accountId:S.accounts[Math.floor(Math.random()*S.accounts.length)].id,
        campaignId:camps[Math.floor(Math.random()*3)][0],
        produto:prods[Math.floor(Math.random()*3)],cliente:nomes[Math.floor(Math.random()*5)],
        valor:[297,397,697][Math.floor(Math.random()*3)],status:st,
        tipo:Math.random()<0.5?'upfront':(Math.random()<0.6?'afterpay':''),source:'webhook'});
    }
    S.orders=[];const sts=['pendente','cobranca','postado','transito','entregue','problema'];
    for(let i=0;i<16;i++) S.orders.push({id:uid(),cliente:nomes[Math.floor(Math.random()*5)],
      produto:prods[Math.floor(Math.random()*3)],valor:[297,397,697][Math.floor(Math.random()*3)],
      status:sts[Math.floor(Math.random()*6)],transportadora:Math.random()<0.5?'Correios':'PayLog',
      tracking:Math.random()<0.6?'BR'+Math.floor(Math.random()*1e9):''});
    S.ctwa=[];
    for(let i=0;i<12;i++) S.ctwa.push({id:uid(),data:d(Math.floor(Math.random()*10)),
      nome:nomes[Math.floor(Math.random()*5)],phone:'+55 33 9'+Math.floor(Math.random()*1e8),
      clid:'ctwa_'+uid()+uid(),campaignName:camps[Math.floor(Math.random()*3)][1],
      evento:'Conversa iniciada',enviadoMeta:Math.random()<0.6,source:'webhook'});
    persist();toast('✨ Dados de exemplo carregados');
  }

  // ================= SYNC =================
  function fnUrl(name){
    return (S.config.backendUrl||'').replace(/\/+$/,'')+'/.netlify/functions/'+name;
  }
  function mergeBackend(d){
    const localTipo={};
    S.sales.forEach(s=>{if(s.source==='webhook')localTipo[s.id]=s.tipo;});
    S.sales=S.sales.filter(s=>s.source!=='webhook')
      .concat((d.sales||[]).map(s=>({...s,source:'webhook',tipo:s.tipo||localTipo[s.id]||''})));
    S.orders=S.orders.filter(o=>o.source!=='webhook')
      .concat((d.orders||[]).map(o=>({...o,source:'webhook'})));
    S.ctwa=S.ctwa.filter(c=>c.source!=='webhook')
      .concat((d.ctwa||[]).map(c=>({...c,source:'webhook',enviadoMeta:c.capiLead||c.enviadoMeta||false})));
  }
  async function syncBackend(silent){
    if(!S.config.backendUrl){if(!silent)toast('Configure a URL do backend primeiro');return;}
    syncState={status:'syncing',at:null};if(!silent)render();
    try{
      const r=await fetch(fnUrl('data')+'?token='+encodeURIComponent(S.config.token||''));
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(d.error)throw new Error(d.error);
      mergeBackend(d);
      syncState={status:'ok',at:new Date()};
      await save();render();
      if(!silent)toast('✅ Vendas e pedidos sincronizados');
    }catch(e){
      syncState={status:'err',at:new Date()};render();
      if(!silent)toast('Falha: '+e.message);
    }
  }
  async function syncMeta(preset,silent){
    if(!S.config.backendUrl){if(!silent)toast('Configure a URL do backend primeiro');return;}
    syncState={status:'syncing',at:null};if(!silent)render();
    const tk=encodeURIComponent(S.config.token||'');
    const pr=preset||'last_30d';
    function aplica(campaigns){
      const dates=new Set();
      (campaigns||[]).forEach(c=>(c.days||[]).forEach(x=>dates.add(x.date)));
      const metaIds=new Set((campaigns||[]).map(c=>String(c.metaId)));
      // só remove tráfego das datas E contas que voltaram nesta chamada
      S.trafego=S.trafego.filter(t=>{
        if(t.source!=='meta')return true;
        const acc=S.accounts.find(a=>a.id===t.accountId);
        return !(acc&&metaIds.has(String(acc.metaId))&&dates.has(t.data));
      });
      (campaigns||[]).forEach(c=>{
        const acc=S.accounts.find(a=>a.metaId===String(c.metaId));
        if(!acc)return;
        (c.days||[]).forEach(day=>{
          S.trafego.push({id:uid(),data:day.date,accountId:acc.id,
            campaignId:c.campaignId,campaignName:c.campaignName,
            investimento:+day.investimento||0,conversas:+day.conversas||0,
            compras:+day.compras||0,valorCompras:+day.valorCompras||0,
            impressions:+day.impressions||0,clicks:+day.clicks||0,linkClicks:+day.linkClicks||0,
            vPlay:+day.vPlay||0,vP25:+day.vP25||0,vP100:+day.vP100||0,vThru:+day.vThru||0,
            source:'meta'});
        });
      });
    }
    try{
      // puxa UMA conta por vez (evita o timeout 502 do Netlify)
      const first=S.accounts[0]?S.accounts[0].metaId:'';
      const r0=await fetch(fnUrl('meta-sync')+'?token='+tk+'&preset='+pr+'&acc='+encodeURIComponent(first));
      if(!r0.ok)throw new Error('HTTP '+r0.status);
      const d0=await r0.json();
      if(d0.error)throw new Error(d0.error);
      aplica(d0.campaigns);
      for(const mid of (d0.accountsAll||[])){
        if(mid===first)continue;
        const r=await fetch(fnUrl('meta-sync')+'?token='+tk+'&preset='+pr+'&acc='+encodeURIComponent(mid));
        if(!r.ok)continue;
        const d=await r.json();
        if(!d.error)aplica(d.campaigns);
      }
      syncState={status:'ok',at:new Date()};
      await save();render();
      if(!silent)toast('✅ Meta Ads sincronizado');
    }catch(e){
      syncState={status:'err',at:new Date()};render();
      if(!silent)toast('Falha Meta: '+e.message);
    }
  }
  let pollTimer=null;
  function startPolling(){
    if(pollTimer)clearInterval(pollTimer);
    if(!S.config.backendUrl)return;
    pollTimer=setInterval(async()=>{
      if(document.hidden)return;
      await syncBackend(true);
      await syncMeta('today',true);
    },180000);
  }

  // ================= DRAG & DROP =================
  function applyDrop(cardKey,dropKey){
    const [ctype,cid]=cardKey.split(':');
    const [field,value]=dropKey.split(':');
    if(ctype==='sale'){
      const s=S.sales.find(x=>x.id===cid);
      if(s&&field==='tipo'){s.tipo=value;persist();}
    }else if(ctype==='order'){
      const o=S.orders.find(x=>x.id===cid);
      if(o&&field==='status'){o.status=value;persist();}
    }
  }

  // ================= WIRE =================
  function wire(){
    document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;modal=null;render();});
    document.querySelectorAll('[data-tab]').forEach(b=>{
      if(b.classList.contains('nav'))return;
      b.onclick=()=>{tab=b.dataset.tab;render();};
    });
    document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>actions(b.dataset.act));
    document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{
      S.config.theme=b.dataset.theme;persist();
    });
    const seg=document.getElementById('rangeSeg');
    if(seg)seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const v=b.dataset.r;
      if(v==='custom'){modalCustom();return;}
      customRange=null;
      filterRange=(v==='all'||v==='today')?v:+v;
      render();
    });
    const af=document.getElementById('accFilter');
    if(af)af.onchange=()=>{filterAcc=af.value;render();};
    const del=(sel,arr,word)=>document.querySelectorAll(sel).forEach(b=>{
      const attr=b.attributes[0].name;
      b.onclick=()=>{S[arr]=S[arr].filter(x=>x.id!==b.getAttribute(attr));persist();toast(word+' removido');};
    });
    del('[data-del-sale]','sales','Venda');
    del('[data-del-order]','orders','Pedido');
    del('[data-del-ctwa]','ctwa','Registro');
    document.querySelectorAll('[data-toggle-ctwa]').forEach(b=>b.onclick=()=>{
      const c=S.ctwa.find(x=>x.id===b.dataset.toggleCtwa);
      if(c){c.enviadoMeta=!c.enviadoMeta;persist();}
    });
    const ov=document.getElementById('ov');
    if(ov)ov.onclick=e=>{if(e.target===ov)closeModal();};
    document.querySelectorAll('.kcard').forEach(card=>{
      card.ondragstart=()=>{drag=card.dataset.card;card.classList.add('drag');};
      card.ondragend=()=>{card.classList.remove('drag');drag=null;};
    });
    document.querySelectorAll('[data-drop]').forEach(col=>{
      col.ondragover=e=>{e.preventDefault();col.classList.add('over');};
      col.ondragleave=()=>col.classList.remove('over');
      col.ondrop=e=>{e.preventDefault();col.classList.remove('over');
        if(drag)applyDrop(drag,col.dataset.drop);};
    });
  }

  // ================= BOOT =================
  async function boot(){
    document.getElementById('root').innerHTML=
      '<div class="loading"><div class="spin"></div>Carregando Apollo…</div>';
    await load();
    render();
    if(S.config.backendUrl){
      await syncBackend(true);
      syncMeta('today',true);
      startPolling();
    }
  }
  boot();
})();
</script>
